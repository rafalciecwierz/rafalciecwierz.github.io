<!doctype html>
<!--
  Prototype 02 — Swiss Signal (`swiss-signal`), LIGHT variant: "Plakat".
  Direction brief: docs/design/DIRECTIONS.md, section 02.

  Concept: the page is a series of International Typographic Style posters printed on white
  paper, in the spirit of Josef Müller-Brockmann's concert posters. One geometric actor runs
  through the whole series: a red-orange signal disc. In the hero it is a big disc that slowly
  follows the cursor and settles into the modules of an invisible six-column grid; the letters
  it covers knock out to white (like an overprint), and the letters at its edge step aside.
  The rest of the page is still, strict and quiet: one typeface, lowercase display type, a grid
  felt only through alignment, and motion limited to the hero and hover states.
  It shares only the style (Swiss typography, kinetic type) with the dark variant, "Night Grid".

  Effects (each is a named function in the script below):
  - SignalDisc .......... custom: a spring-driven disc that follows the mouse, snaps to the
                          nearest grid module when the cursor rests, and moves to a tapped point
                          on touch (rAF, paused when the hero is off-screen)
  - KnockoutName ........ custom: a white copy of the name clipped to the disc (CSS clip-path)
  - LetterRepel ......... custom: letters near the disc edge shift and tilt away from it
  - FitName, FitText .... custom: the name and the email are sized to the grid width
  - NavSignal ........... custom: a small signal disc marks the section in view
  - ProjectPosters ...... custom SVG: each project gets a mini poster built from its position in
                          the list; its shape moves on hover
  - PortraitWink ........ custom CSS: the geometric portrait winks on hover
  - PrintPoster ......... custom easter egg: printing the page (Ctrl/Cmd+P, or the footer
                          button) gives a one-page A4 poster CV (print stylesheet)
  - MobileMenu, ConsoleHello: custom

  Libraries in this file: none.
  Fonts: Schibsted Grotesk (Google Fonts, wght 400–900, latin-ext), the only typeface.
  React build would need: nothing beyond React. No GSAP, no WebGL.

  Reduced motion: the disc sits still in its composed position (the knockout and the letter
  offsets are drawn once), no smooth scroll, no hover transitions. No WebGL is used, so there is
  no WebGL fallback to provide.

  Content: all copy lives in the CONTENT object at the top of the script. Additions beyond
  brief section 5 are marked `NEW CONTENT` there.
-->

  /* =====================================================================
     Effects
     ===================================================================== */

  // FitName (custom): the longest name line fills a set share of the grid width,
  // capped so the two lines never take more than ~46% of the hero height.
  function FitName() {
    const box = $('#nameBox'), h1 = $('#hero-name'), knock = $('#nameKnock'), hero = $('#top');
    const lineWidth = (ln) => { const c = ln.children; return c[c.length - 1].offsetLeft + c[c.length - 1].offsetWidth - c[0].offsetLeft; };
    let width = 0;
    function fit() {
      h1.style.fontSize = knock.style.fontSize = '100px';
      const w = Math.max(...$$('.ln', h1).map(lineWidth));
      const share = wideMQ.matches ? 0.8 : 0.99;
      const cap = (hero.clientHeight * 0.46) / 1.68;
      const fs = Math.min((box.clientWidth * share * 100) / w, cap);
      h1.style.fontSize = knock.style.fontSize = `${fs}px`;
      width = (w * fs) / 100;
    }
    return { fit, get width() { return width; }, get fontSize() { return parseFloat(h1.style.fontSize); } };
  }

  // KnockoutName (custom): the white copy of the name shows only inside the disc
  function KnockoutName() {
    const knock = $('#nameKnock');
    return {
      update(cx, cy, r) { knock.style.clipPath = `circle(${r.toFixed(1)}px at ${cx.toFixed(1)}px ${cy.toFixed(1)}px)`; }
    };
  }

  // LetterRepel (custom): letters close to the disc edge shift and tilt away from its centre.
  // Positions are measured once per layout (offsetLeft ignores transforms), so a frame only does maths.
  function LetterRepel() {
    const inks = $$('#hero-name .ch'), knocks = $$('#nameKnock .ch');
    let base = [], fs = 100;
    return {
      measure(fontSize) {
        fs = fontSize;
        base = inks.map((el) => ({ x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight * 0.6 }));
      },
      update(cx, cy, r) {
        const maxPush = fs * 0.09, sigma = fs * 0.22;
        base.forEach((b, i) => {
          const dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy) || 1;
          const edge = d - r;
          const f = Math.exp(-(edge * edge) / (2 * sigma * sigma));
          const tx = (dx / d) * maxPush * f, ty = (dy / d) * maxPush * f * 0.5, rot = (dx / d) * f * 5;
          const t = f < 0.01 ? '' : `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`;
          inks[i].style.transform = t;
          knocks[i].style.transform = t;
        });
      }
    };
  }

  // SignalDisc (custom): a spring follows a target point. The target is the mouse, the nearest
  // grid module once the mouse rests, a tapped point on touch, or the composed rest position.
  function SignalDisc({ fitName, knockout, repel }) {
    const hero = $('#top'), disc = $('#disc'), box = $('#nameBox');
    let D = 0, nb = { x: 0, y: 0, w: 0 }, rest = { x: 0, y: 0 };
    const pos = { x: 0, y: 0 }, vel = { x: 0, y: 0 }, target = { x: 0, y: 0 };
    let raf = 0, last = 0, idle = 0, visible = true, down = null;

    function layout() {
      fitName.fit();
      const hr = hero.getBoundingClientRect(), br = box.getBoundingClientRect();
      const wide = wideMQ.matches;
      nb = { x: br.left - hr.left, y: br.top - hr.top, w: br.width, h: br.height };
      D = wide ? Math.min(hr.width * 0.42, hr.height * 0.6) : Math.min(hr.width * 0.86, hr.height * 0.46);
      // Rest: right of the short first line, biting into the end of the long second line
      rest = wide
        ? { x: nb.x + fitName.width * 0.8 + D * 0.06, y: nb.y + nb.h * 0.3 }
        : { x: nb.x + nb.w - D * 0.34, y: nb.y + nb.h * 0.9 - D / 2 };
      repel.measure(fitName.fontSize);
      Object.assign(target, rest);
      Object.assign(pos, rest);
      vel.x = vel.y = 0;
      draw();
    }

    function snap(p) {
      // modules of the invisible grid: 6 columns on desktop, 4 on phones, square cells
      const cols = wideMQ.matches ? 6 : 4;
      const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 16;
      const pitch = (nb.w + gap) / cols, half = (pitch - gap) / 2;
      const col = Math.max(0, Math.min(cols - 1, Math.round((p.x - nb.x - half) / pitch)));
      const rows = Math.max(1, Math.floor(hero.clientHeight / pitch));
      const row = Math.max(0, Math.min(rows - 1, Math.round((p.y - half) / pitch)));
      return { x: nb.x + half + col * pitch, y: half + row * pitch };
    }

    function draw() {
      const r = D / 2;
      disc.style.width = disc.style.height = `${D}px`;
      disc.style.transform = `translate3d(${(pos.x - r).toFixed(1)}px, ${(pos.y - r).toFixed(1)}px, 0)`;
      const cx = pos.x - nb.x, cy = pos.y - nb.y;
      knockout.update(cx, cy, r);
      repel.update(cx, cy, r);
    }

    function tick(now) {
      const dt = Math.min(3, (now - last) / 16.67 || 1);
      last = now;
      for (const k of ['x', 'y']) {
        vel[k] += (target[k] - pos[k]) * 0.035 * dt;
        vel[k] *= Math.pow(0.86, dt);
        pos[k] += vel[k] * dt;
      }
      draw();
      const settled = Math.abs(vel.x) + Math.abs(vel.y) < 0.05 && Math.abs(target.x - pos.x) + Math.abs(target.y - pos.y) < 0.5;
      raf = settled || !visible ? 0 : requestAnimationFrame(tick);
    }
    function wake() { if (!raf && visible) { last = performance.now(); raf = requestAnimationFrame(tick); } }
    function aim(p) { Object.assign(target, p); wake(); }
    const local = (e) => { const hr = hero.getBoundingClientRect(); return { x: e.clientX - hr.left, y: e.clientY - hr.top }; };

    layout();
    let rt = 0;
    addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
    if (reduceMotion) return; // static composition: drawn once at rest

    new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible) wake(); }).observe(hero);
    hero.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      aim(local(e));
      clearTimeout(idle);
      idle = setTimeout(() => aim(snap(local(e))), 450);
    });
    hero.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { clearTimeout(idle); aim(rest); } });
    hero.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') down = { x: e.clientX, y: e.clientY }; });
    hero.addEventListener('pointerup', (e) => {
      if (e.pointerType === 'mouse' || !down || e.target.closest('a, button')) return;
      if (Math.hypot(e.clientX - down.x, e.clientY - down.y) < 10) aim(snap(local(e)));
      down = null;
    });
  }

  // FitText (custom): the email fills the grid width
  function FitText(el, max = 220) {
    function fit() {
      const avail = el.parentElement.clientWidth;
      el.style.fontSize = '100px';
      const w = el.scrollWidth;
      el.style.fontSize = `${Math.min((avail * 100) / w, max)}px`;
    }
    fit();
    addEventListener('resize', fit);
  }

  // NavSignal (custom): a small disc marks the nav link of the section in view; the header
  // gets its rule once the hero has scrolled away
  function NavSignal() {
    const links = $$('[data-nav]');
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        links.forEach((a) => a.toggleAttribute('aria-current', false));
        links.filter((a) => a.dataset.nav === e.target.id).forEach((a) => a.setAttribute('aria-current', 'true'));
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    CONTENT.nav.forEach((n) => io.observe(document.getElementById(n.id)));
    new IntersectionObserver(([e]) => $('#hdr').classList.toggle('ruled', !e.isIntersecting), { rootMargin: '-80px 0px 0px 0px' })
      .observe($('.cta'));
  }

  // MobileMenu (custom): full-screen list, focus trapped while open, Esc closes
  function MobileMenu() {
    const btn = $('#menuBtn'), menu = $('#menu');
    const focusables = () => [btn, ...$$('a', menu)];
    function set(open) {
      menu.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
      btn.textContent = open ? 'Close' : 'Menu';
      document.documentElement.style.overflow = open ? 'hidden' : '';
      if (open) $('a', menu).focus();
    }
    btn.addEventListener('click', () => set(menu.hidden));
    menu.addEventListener('click', (e) => { if (e.target.closest('a')) set(false); });
    document.addEventListener('keydown', (e) => {
      if (menu.hidden) return;
      if (e.key === 'Escape') { set(false); btn.focus(); }
      if (e.key === 'Tab') {
        const f = focusables(), i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      }
    });
    wideMQ.addEventListener('change', () => set(false));
  }

  function ConsoleHello() {
    console.log('%c● %c' + CONTENT.console, 'color:#FF4000;font-size:20px', 'font:700 13px sans-serif');
  }

  /* =====================================================================
     Boot
     ===================================================================== */
  renderHeader();
  renderHero();
  renderAbout();
  renderStack();
  renderCareer();
  renderTeam();
  renderProjects();
  renderContact();
  renderFooter();
  renderPrintPoster();
  MobileMenu();
  NavSignal();
  ConsoleHello();

  document.fonts.ready.then(() => {
    SignalDisc({ fitName: FitName(), knockout: KnockoutName(), repel: LetterRepel() });
    FitText($('#email'));
  });
</script>
