<!doctype html>
<!--
  Prototype 03 — Clay Studio (`clay-studio`), LIGHT variant: "Morning Claymation".
  Direction brief: docs/design/DIRECTIONS.md, section 03.

  Concept: a stop-motion animator's table on a sunny morning. Everything is made of
  plasticine: the name is modelled from clay letters, the sections are clay boards laid on the
  table, and the skills are rolled clay pieces on trays. Motion runs the way claymation does:
  at 12 frames per second, with a slight "boil" (outlines that shift a little every frame, as
  hand-made frames never line up perfectly). The content itself stays crisp and businesslike;
  the craft is in the material and the timing.
  It shares only the style (claymorphism, soft 3D) with the dark variant, "After Hours".
  No 3D figure in the hero (that is the dark variant's hero object).

  Effects (each is a named function in the script below):
  - StopMotion ......... custom: one 12 fps frame clock for the page; it cycles three SVG
                         turbulence filters on `.boil` elements (the claymation boil)
  - ClayLetters ........ custom: name letters squash towards the cursor or finger and spring
                         back; their positions are only redrawn on stop-motion frames, so the
                         spring looks animated by hand
  - LooseMarks ......... custom: the stroke of the Ł and the accent of the Ć are separate clay
                         pieces that pop off when poked and fall back into place
  - ClayPortrait ....... custom SVG: a flat clay portrait of Rafał that blinks (frame swap)
  - PlaceOnTray ........ custom: when a tray scrolls into view its pieces are placed one per
                         frame, like an animator setting up a shot
  - Thumbprint ......... custom SVG pattern: fingerprints pressed into the clay boards
  - ClayEnvelope ....... custom CSS: the contact envelope opens on hover or focus and the
                         letter (the email) slides out
  - PressButton ........ custom CSS: clay slab buttons that flatten when pressed
  - MobileMenu, ConsoleHello: custom

  Libraries in this file: none.
  Fonts: Baloo 2 (display, 500–800) and Onest (body, 400–700), Google Fonts, latin-ext.
  React build would need: nothing beyond React. No WebGL, no GSAP.

  Reduced motion: no boil, no squash, no placing animation, no envelope motion (it is drawn
  open), native anchor jumps. There is no WebGL, so no WebGL fallback is needed.

  Content: all copy lives in the CONTENT object at the top of the script. Additions beyond
  brief section 5 are marked `NEW CONTENT` there.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafał Ciećwierz, Frontend Engineer</title>
<meta name="description" content="Rafał Ciećwierz, Frontend Engineer. React & TypeScript, 5+ years building production apps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500..800&family=Onest:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --table: #FFF9F2;       /* the animator's table */
    --peach: #FFC9AE;
    --butter: #FFE59C;
    --mint: #B7EBD7;
    --lilac: #D9CCF8;
    --ink: #2B2140;         /* 15:1 on table */
    --muted: #5C5270;       /* 7.4:1 on table, ≥ 5.6:1 on every board */
    /* deep clay, for the name letters (each ≥ 3:1 on table, large text) */
    --navy: #2F3C8F; --navy-side: #1C2560; /* the name: navy clay, like the blazer */
    --c-pink: #E04A74; --c-blue: #3E62DE; --c-green: #1B8F68; --c-violet: #7650DC; --c-orange: #C96A00;
    --gut: 16px;
    --step: steps(4, end);
  }
  @media (min-width: 768px) { :root { --gut: 32px; } }
  @media (min-width: 1280px) { :root { --gut: 64px; } }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 84px; }
  body {
    margin: 0; color: var(--ink); background: var(--table);
    font: 400 1.0625rem/1.65 Onest, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  h1, h2, h3 { font-family: 'Baloo 2', Onest, sans-serif; margin: 0; line-height: 1; }
  p { margin: 0; }
  a { color: inherit; }
  svg { display: block; }
  :focus-visible { outline: 3px solid var(--c-blue); outline-offset: 3px; border-radius: 10px; }
  .skip { position: fixed; left: 12px; top: -80px; z-index: 100; padding: 12px 18px; border-radius: 14px; background: var(--ink); color: var(--table); font-weight: 700; text-decoration: none; }
  .skip:focus { top: 12px; }
  .wrap { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 var(--gut); }
  .vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Clay board (a flattened sheet of plasticine) ---------- */
  .board {
    --b: var(--peach);
    position: relative; background-color: var(--b); border-radius: 26px 30px 24px 32px / 30px 24px 32px 26px;
    box-shadow:
      inset 0 3px 0 rgba(255, 255, 255, .55),
      inset 0 -5px 0 rgba(43, 33, 64, .08),
      0 2px 0 color-mix(in srgb, var(--b) 70%, #000 12%),
      0 6px 0 color-mix(in srgb, var(--b) 62%, #000 18%),
      0 18px 30px -10px rgba(120, 80, 40, .28);
  }
  /* Thumbprint: fingerprints pressed into the board (SVG pattern, set from JS) */
  .board::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background-image: var(--prints); opacity: .5; pointer-events: none; mix-blend-mode: multiply; }
  .board > * { position: relative; }

  /* PressButton */
  .btn {
    --b: var(--butter);
    display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 26px 4px;
    border: 0; border-radius: 18px 20px 17px 21px; cursor: pointer; text-decoration: none;
    font: 700 1.1875rem/1 'Baloo 2', sans-serif; color: var(--ink); background: var(--b);
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, .6), 0 6px 0 color-mix(in srgb, var(--b) 60%, #000 22%), 0 14px 22px -8px rgba(120, 80, 40, .35);
    transform: translateY(0); transition: transform .12s var(--step), box-shadow .12s var(--step);
  }
  .btn:hover { transform: translateY(-2px) rotate(-1deg); }
  .btn:active { transform: translateY(5px) scaleY(.94); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .6), 0 1px 0 color-mix(in srgb, var(--b) 60%, #000 22%), 0 4px 8px -4px rgba(120, 80, 40, .3); }
  .btn--mint { --b: var(--mint); }
  .btn svg { width: 22px; height: 22px; flex: none; }

  /* ---------- Header ---------- */
  .header { position: fixed; inset: 0 0 auto; z-index: 40; padding: 12px 0; transition: background .2s var(--step), box-shadow .2s; }
  .header.is-scrolled { background: rgba(255, 249, 242, .92); box-shadow: 0 1px 0 rgba(43, 33, 64, .08); backdrop-filter: blur(8px); }
  .header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 700 1.25rem/1 'Baloo 2', sans-serif; }
  .pellets { display: flex; gap: 3px; }
  .pellets i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset -2px -2px 0 rgba(0, 0, 0, .14), inset 1px 1px 0 rgba(255, 255, 255, .6); }
  .nav ul { display: none; list-style: none; margin: 0; padding: 0; gap: 8px; }
  .nav a {
    display: block; padding: 8px 16px 10px; border-radius: 999px; text-decoration: none; font: 600 1.0625rem/1 'Baloo 2', sans-serif;
    background: var(--table); box-shadow: inset 0 0 0 2px rgba(43, 33, 64, .1);
    transition: transform .15s var(--step), background .15s var(--step);
  }
  .nav a:hover { transform: rotate(-3deg); }
  .nav a.is-active { background: var(--b, var(--butter)); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .6), 0 3px 0 rgba(43, 33, 64, .18); }
  .menu-btn { min-height: 46px; padding: 0 18px 3px; font-size: 1.0625rem; }
  .menu { position: fixed; inset: 72px 12px auto; z-index: 39; list-style: none; margin: 0; padding: 12px; --b: var(--lilac); }
  .menu a { display: block; padding: 14px 16px; text-decoration: none; font: 700 1.6rem/1 'Baloo 2', sans-serif; border-radius: 14px; }
  @media (min-width: 900px) { .nav ul { display: flex; } .menu-btn, .menu { display: none !important; } }

  /* ---------- Hero ---------- */
  .hero { position: relative; padding: 128px 0 64px; display: flex; align-items: center; overflow: hidden; }
  @media (min-width: 900px) { .hero { min-height: 100svh; padding: 100px 0 56px; } }
  /* morning light through a window, falling across the table */
  .hero::before {
    content: ""; position: absolute; inset: -20% -10%; pointer-events: none; filter: blur(36px); opacity: .9;
    background: linear-gradient(118deg, transparent 8%, rgba(255, 224, 160, .55) 8% 22%, transparent 22% 27%, rgba(255, 224, 160, .45) 27% 41%, transparent 41%);
  }
  .hero .wrap { position: relative; }
  .name {
    font-weight: 800; font-size: clamp(3.4rem, 19.5vw, 15.5rem); line-height: .84; letter-spacing: -.01em;
    margin-left: -.04em; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .name .line { display: block; white-space: nowrap; }
  .lt {
    --c: var(--navy); --d: var(--navy-side);
    position: relative; display: inline-block; color: var(--c); transform-origin: 50% 90%; rotate: var(--r, 0deg);
    text-shadow: 0 .02em 0 var(--d), 0 .035em 0 var(--d), 0 .05em 0 var(--d), 0 .08em .06em rgba(120, 80, 40, .22);
  }
  .lt.is-poked { cursor: grab; }
  /* LooseMarks: the Ł stroke and the Ć accent as separate clay pieces */
  .mark {
    --c: var(--c-pink); --d: #A8304F;
    position: absolute; display: block; background: var(--c); border-radius: 999px; pointer-events: none;
    box-shadow: 0 .02em 0 var(--d), 0 .04em 0 var(--d), 0 .07em .05em rgba(120, 80, 40, .2);
  }
  .mark--stroke { left: -.04em; top: .44em; width: .4em; height: .085em; transform: rotate(-28deg); }
  .mark--acute { left: .2em; top: .02em; width: .26em; height: .095em; transform: rotate(-32deg); }
  .hero-foot { display: grid; gap: 22px; margin-top: 34px; }
  .role { font: 700 clamp(1.6rem, 5.4vw, 2.4rem)/1.05 'Baloo 2', sans-serif; }
  .tagline { margin-top: 6px; color: var(--muted); font-size: 1.125rem; }
  .ctas { display: flex; flex-wrap: wrap; gap: 14px; }
  @media (min-width: 900px) {
    .hero-foot { grid-template-columns: 1fr auto; align-items: end; margin-top: 48px; }
  }

  /* StopMotion boil: three filters cycled on .boil elements */
  .boil { filter: var(--boil, none); }

  /* ---------- Sections ---------- */
  .sec { padding: 88px 0; }
  @media (min-width: 1000px) { .sec { padding: 128px 0; } }
  .sec-head { display: grid; gap: 10px; margin-bottom: 40px; max-width: 760px; }
  .h2 { font-weight: 800; font-size: clamp(2.8rem, 9vw, 5.6rem); line-height: .9; }
  .intro { color: var(--muted); font-size: 1.1875rem; max-width: 54ch; }

  /* About */
  .about { display: grid; gap: 40px; align-items: center; }
  .about-text { display: grid; gap: 18px; font-size: 1.1875rem; max-width: 60ch; }
  .portrait { --b: var(--mint); padding: 18px; max-width: 420px; transform: rotate(2deg); }
  .portrait svg { width: 100%; height: auto; }
  .portrait figcaption { margin-top: 10px; font-size: .9375rem; color: var(--muted); text-align: center; }
  @media (min-width: 1000px) { .about { grid-template-columns: 1.3fr 1fr; gap: 80px; } .portrait { justify-self: end; } }

  /* Stack: trays of rolled clay pieces */
  .trays { display: grid; gap: 26px; align-items: start; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
  .tray { padding: 22px 22px 26px; }
  .tray:nth-child(5n+1) { --b: var(--peach); }
  .tray:nth-child(5n+2) { --b: var(--lilac); }
  .tray:nth-child(5n+3) { --b: var(--mint); }
  .tray:nth-child(5n+4) { --b: var(--butter); }
  .tray:nth-child(5n+5) { --b: #FFD3DE; }
  .tray h3 { font-size: 1.75rem; font-weight: 800; margin-bottom: 14px; }
  .lvl { margin-top: 14px; }
  .lvl dt { font-size: .875rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .lvl dd { margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .piece {
    display: inline-block; background: var(--table); color: var(--ink); border-radius: 999px; font-family: 'Baloo 2', sans-serif; font-weight: 700;
    box-shadow: inset 0 2px 0 #fff, 0 3px 0 rgba(43, 33, 64, .16), 0 6px 10px -4px rgba(43, 33, 64, .2);
  }
  .piece--strong { font-size: 1.1875rem; padding: 6px 16px 5px; box-shadow: inset 0 2px 0 #fff, 0 4px 0 rgba(43, 33, 64, .2), 0 8px 12px -4px rgba(43, 33, 64, .22); }
  .piece--medium { font-size: 1rem; padding: 5px 13px 4px; }
  .piece--low { font-size: .875rem; padding: 3px 10px 2px; background: rgba(255, 249, 242, .6); box-shadow: inset 0 0 0 1.5px rgba(43, 33, 64, .18); }
  .piece.is-waiting { opacity: 0; transform: translateY(-14px) rotate(-6deg); }
  .piece.is-placed { opacity: 1; transform: none; }

  /* Career: a staircase of clay blocks, newest (highest) first */
  .stairs { display: grid; gap: 22px; list-style: none; margin: 0; padding: 0; }
  .step { padding: 24px 22px 26px; }
  .stairs > li:nth-child(4n+1) > .step { --b: var(--butter); }
  .stairs > li:nth-child(4n+2) > .step { --b: var(--lilac); }
  .stairs > li:nth-child(4n+3) > .step { --b: var(--peach); }
  .stairs > li:nth-child(4n+4) > .step { --b: var(--mint); }
  .step-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
  .step h3 { font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 800; }
  .dates { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .roles { margin-top: 6px; font: 600 1.25rem/1.3 'Baloo 2', sans-serif; }
  .promo {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 4px 14px 4px 6px; border-radius: 999px;
    background: var(--ink); color: var(--table); font: 700 .9375rem/1.6 'Baloo 2', sans-serif;
  }
  .promo svg { width: 26px; height: 26px; }
  .step .points { margin: 14px 0 0; padding-left: 20px; display: grid; gap: 6px; max-width: 72ch; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; padding: 0; list-style: none; }
  .tag { font-size: .8125rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: rgba(255, 249, 242, .7); box-shadow: inset 0 0 0 1.5px rgba(43, 33, 64, .14); }
  .edu { margin-top: 22px; padding: 18px 22px; --b: #EFE7DC; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; }
  .edu b { font: 700 1.25rem/1.2 'Baloo 2', sans-serif; }
  @media (min-width: 1000px) {
    /* each older job sits one step lower and further left */
    .stairs > li { margin-left: calc((var(--n) - 1 - var(--i)) * 7%); margin-right: calc(var(--i) * 7%); }
    .step { padding: 30px 36px 32px; }
  }

  /* Team: plasticine notes pressed on with a thumb */
  .notes { display: grid; gap: 34px; list-style: none; margin: 0; padding: 0; }
  .note { padding: 34px 26px 24px; margin: 0; }
  .notes > li:nth-child(3n+1) > .note { --b: var(--lilac); transform: rotate(-1.5deg); }
  .notes > li:nth-child(3n+2) > .note { --b: var(--butter); transform: rotate(1.2deg); }
  .notes > li:nth-child(3n+3) > .note { --b: var(--mint); transform: rotate(-.8deg); }
  .thumb { position: absolute; top: -16px; left: 50%; width: 46px; height: 34px; margin-left: -23px; border-radius: 50%; background: #F7A9BE; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .1), 0 3px 0 #D9849C; }
  .thumb svg { width: 100%; height: 100%; }
  .note blockquote { margin: 0; font: 500 1.25rem/1.45 'Baloo 2', sans-serif; }
  .note blockquote p + p { margin-top: 8px; }
  .note figcaption { margin-top: 16px; font-size: .9375rem; color: var(--muted); }
  .note figcaption b { color: var(--ink); font-weight: 700; }
  @media (min-width: 1000px) { .notes { grid-template-columns: repeat(3, 1fr); } }

  /* Projects: modelling tiles with a pressed initial */
  .tiles { display: grid; gap: 26px; list-style: none; margin: 0; padding: 0; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  .tile { display: flex; flex-direction: column; height: 100%; padding: 22px; --b: #FFFFFF; }
  .tiles > li:nth-child(4n+1) .press { --c: var(--c-pink); --d: #A8304F; }
  .tiles > li:nth-child(4n+2) .press { --c: var(--c-blue); --d: #2A45A8; }
  .tiles > li:nth-child(4n+3) .press { --c: var(--c-green); --d: #116347; }
  .tiles > li:nth-child(4n+4) .press { --c: var(--c-violet); --d: #5434A8; }
  .tile-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .press { font: 800 5rem/.8 'Baloo 2', sans-serif; color: var(--c); text-shadow: 0 2px 0 var(--d), 0 4px 0 var(--d), 0 7px 8px rgba(120, 80, 40, .2); }
  .status { padding: 3px 12px; border-radius: 999px; font-weight: 700; font-size: .8125rem; white-space: nowrap; }
  .status--live { background: var(--mint); }
  .status--in-progress { background: var(--butter); }
  .status--archived { background: #ECE6F7; }
  .tile h3 { margin-top: 18px; font-size: 1.6rem; font-weight: 800; line-height: 1.05; }
  .tile .note-line { margin-top: 6px; color: var(--muted); font-size: .9375rem; }
  .tile .desc { margin-top: 10px; color: var(--muted); font-size: 1rem; }
  .tile .links { margin-top: auto; padding-top: 16px; }
  .tile .links a { font-weight: 700; text-underline-offset: 4px; text-decoration-thickness: 2px; text-decoration-color: var(--c-blue); }

  /* Contact: ClayEnvelope */
  .contact-grid { display: grid; gap: 48px; align-items: center; }
  .avail { font: 600 clamp(1.5rem, 3.4vw, 2.2rem)/1.25 'Baloo 2', sans-serif; max-width: 24ch; }
  .email { display: inline-block; margin-top: 22px; font: 700 clamp(1.25rem, 4.6vw, 2.2rem)/1.2 'Baloo 2', sans-serif; overflow-wrap: anywhere; text-underline-offset: 6px; text-decoration-thickness: 3px; text-decoration-color: var(--c-pink); }
  .links-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; list-style: none; padding: 0; }
  .links-row a, .links-row span { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px 2px; border-radius: 999px; font-weight: 700; text-decoration: none; background: #fff; box-shadow: inset 0 0 0 2px rgba(43, 33, 64, .12); }
  .links-row span { color: var(--muted); font-weight: 600; }
  .contact .ctas { margin-top: 26px; }
  /* the top margin leaves room for the open flap (64% of the height, height = width / 1.45) */
  .envelope { position: relative; width: min(100%, 520px); aspect-ratio: 1.45; margin: min(48%, 250px) auto 0; perspective: 900px; }
  .env-back, .env-front, .env-flap { position: absolute; inset: 0; border-radius: 26px; }
  .env-back { background: #F5B596; box-shadow: 0 6px 0 #D99274, 0 24px 36px -14px rgba(120, 80, 40, .4); }
  .env-letter {
    position: absolute; left: 7%; right: 7%; top: 46%; height: 52%; padding: 18px 22px; border-radius: 16px; background: #FFFDF9;
    box-shadow: 0 2px 0 rgba(43, 33, 64, .08); display: grid; align-content: start; gap: 8px; transition: transform .5s steps(6, end);
  }
  .env-letter small { color: var(--muted); font-size: .9375rem; }
  .env-letter a { font: 700 clamp(1rem, 3.6vw, 1.6rem)/1.15 'Baloo 2', sans-serif; overflow-wrap: anywhere; text-underline-offset: 5px; text-decoration-thickness: 3px; text-decoration-color: var(--c-pink); }
  .env-front { clip-path: polygon(0 34%, 50% 70%, 100% 34%, 100% 100%, 0 100%); background: var(--peach); box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .06); pointer-events: none; }
  .env-flap {
    height: 64%; clip-path: polygon(0 0, 100% 0, 50% 100%); background: #FFB894; transform-origin: 50% 0; pointer-events: none;
    transition: transform .4s steps(5, end); z-index: 2;
  }
  .env-seal { position: absolute; left: 50%; top: 56%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: var(--c-pink); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15), 0 3px 0 #A8304F; z-index: 3; transition: opacity .2s steps(2, end); pointer-events: none; }
  .envelope.is-open .env-flap { transform: rotateX(180deg); z-index: 0; }
  .envelope.is-open .env-letter { transform: translateY(-86%); }
  .envelope.is-open .env-seal { opacity: 0; }
  @media (min-width: 1000px) { .contact-grid { grid-template-columns: 1fr 1fr; } .envelope { margin-top: 200px; } }

  .footer { padding: 36px 0 44px; color: var(--muted); font-size: .9375rem; }
  .footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .boil { filter: none !important; }
  }
</style>
</head>

<!-- StopMotion boil filters: same displacement, three seeds -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="boil0"><feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
  <filter id="boil1"><feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
  <filter id="boil2"><feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="13"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
</svg>

  /* =====================================================================
     Thumbprint (custom): an SVG fingerprint pattern for the clay boards
     ===================================================================== */
  function Thumbprint() {
    let arcs = '';
    const prints = [[60, 50, .3], [210, 150, -.6], [120, 230, 1.1]];
    for (const [x, y, r] of prints) for (let k = 4; k < 30; k += 4.2) arcs += `<ellipse cx="${x}" cy="${y}" rx="${k}" ry="${k * .72}" transform="rotate(${r * 57} ${x} ${y})" stroke-dasharray="${k * 2.4} 6"/>`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280"><g fill="none" stroke="rgba(43,33,64,.09)" stroke-width="1.3">${arcs}</g></svg>`;
    document.documentElement.style.setProperty('--prints', `url("data:image/svg+xml,${encodeURIComponent(svg)}")`);
  }

  /* =====================================================================
     StopMotion (custom): a 12 fps frame clock shared by all clay motion
     ===================================================================== */
  const StopMotion = (() => {
    const subs = new Set();
    let frame = 0, last = 0, raf = 0;
    const FPS = 12;
    function loop(now) {
      raf = requestAnimationFrame(loop);
      if (now - last < 1000 / FPS) return;
      last = now; frame++;
      document.documentElement.style.setProperty('--boil', `url(#boil${frame % 3})`);
      subs.forEach((fn) => fn(frame));
    }
    return {
      start() { if (!reduceMotion && !raf) raf = requestAnimationFrame(loop); },
      stop() { cancelAnimationFrame(raf); raf = 0; },
      on(fn) { subs.add(fn); return () => subs.delete(fn); }
    };
  })();

    const measure = () => letters.forEach((L) => { const r = L.el.getBoundingClientRect(); L.cx = r.left + r.width / 2; L.cy = r.top + r.height / 2 + scrollY; L.w = r.width; });
    measure(); addEventListener('resize', measure); document.fonts.ready.then(measure);
    let px = -9999, py = -9999;
    const name = $('#heroName');
    name.addEventListener('pointermove', (e) => { px = e.clientX; py = e.clientY + scrollY; });
    name.addEventListener('pointerleave', () => { px = py = -9999; });
    name.addEventListener('pointerdown', (e) => {
      // a poke: the nearest letter squashes hard; a loose mark pops off
      let best = null, bd = Infinity;
      for (const L of letters) { const d = Math.hypot(L.cx - e.clientX, L.cy - (e.clientY + scrollY)); if (d < bd) { bd = d; best = L; } }
      if (best) { best.v -= .55; if (best.mark) best.pv = -1.4; }
    });
    // Physics runs every frame of the clock; the transforms are only written on clock frames,
    // so the motion has the slightly jerky timing of hand-animated clay.
    StopMotion.on(() => {
      for (const L of letters) {
        const reach = L.w * 1.6, d = Math.hypot(L.cx - px, L.cy - py);
        L.t = d < reach ? (1 - d / reach) * .32 : 0;
        L.v += (L.t - L.s) * .55; L.v *= .5; L.s += L.v;            // spring towards the squash target
        L.pv += .45; L.pop += L.pv; if (L.pop > 0) { L.pop = 0; L.pv *= -.35; }  // mark falls back and bounces
        const sq = Math.max(-.2, Math.min(.45, L.s));
        L.el.style.transform = sq ? `scale(${1 + sq * .55}, ${1 - sq})` : '';
        if (L.mark) L.mark.style.translate = L.pop ? `0 ${L.pop * .12}em` : '';
      }
    });
  }

  /* ClayPortrait blink (custom): swap to the shut-eyes frame for two clock frames */
  function ClayPortrait() {
    if (reduceMotion) return;
    const open = $('#eyesOpen'), shut = $('#eyesShut');
    let next = 30, until = 0;
    StopMotion.on((f) => {
      if (f >= next) { until = f + 2; next = f + 30 + Math.floor(Math.random() * 40); }
      const closed = f < until;
      open.style.display = closed ? 'none' : ''; shut.style.display = closed ? '' : 'none';
    });
  }

  /* PlaceOnTray (custom): pieces are placed one per frame when a tray comes into view */
  function PlaceOnTray() {
    if (reduceMotion) return;
    const queue = [];
    $$('.tray').forEach((tray) => $$('.piece', tray).forEach((p) => p.classList.add('is-waiting')));
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) { queue.push(...$$('.piece.is-waiting', e.target)); io.unobserve(e.target); }
    }, { threshold: .25 });
    $$('.tray').forEach((t) => io.observe(t));
    StopMotion.on(() => {
      for (let k = 0; k < 2 && queue.length; k++) { const p = queue.shift(); p.classList.remove('is-waiting'); p.classList.add('is-placed'); }
    });
  }

  /* ClayEnvelope (custom): opens on hover or when anything inside gets focus */
  function ClayEnvelope() {
    const env = $('#envelope');
    if (reduceMotion) return;
    const set = (v) => env.classList.toggle('is-open', v);
    env.addEventListener('pointerenter', () => set(true));
    env.addEventListener('pointerleave', () => { if (!env.contains(document.activeElement)) set(false); });
    env.addEventListener('focusin', () => set(true));
    env.addEventListener('focusout', () => set(false));
    // on touch screens open it once it is well in view
    new IntersectionObserver(([e]) => { if (matchMedia('(hover: none)').matches) set(e.intersectionRatio > .7); }, { threshold: [0, .7, 1] }).observe(env);
  }

  /* =====================================================================
     NavState, MobileMenu, ConsoleHello (custom)
     ===================================================================== */
  function NavState() {
    const links = $$('[data-nav]');
    const colors = ['var(--peach)', 'var(--lilac)', 'var(--mint)', 'var(--butter)', '#FFD3DE'];
    links.forEach((a) => a.style.setProperty('--b', colors[CONTENT.nav.findIndex((n) => n.id === a.dataset.nav) % colors.length]));
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) links.forEach((a) => a.classList.toggle('is-active', a.dataset.nav === e.target.id));
    }, { rootMargin: '-45% 0px -50% 0px' });
    ['top', ...CONTENT.nav.map((n) => n.id)].forEach((id) => io.observe(document.getElementById(id)));
    const header = $('#header');
    const onScroll = () => header.classList.toggle('is-scrolled', scrollY > 30);
    addEventListener('scroll', onScroll, { passive: true }); onScroll();
  }

  function MobileMenu() {
    const btn = $('#menuBtn'), menu = $('#menu');
    const focusables = () => [btn, ...$$('a', menu)];
    function set(open) {
      menu.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
      btn.textContent = open ? 'Close' : 'Menu';
      document.documentElement.style.overflow = open ? 'hidden' : '';
      if (open) $('a', menu).focus();
    }
    btn.addEventListener('click', () => set(menu.hidden));
    menu.addEventListener('click', (e) => { if (e.target.closest('a')) set(false); });
    document.addEventListener('keydown', (e) => {
      if (menu.hidden) return;
      if (e.key === 'Escape') { set(false); btn.focus(); }
      if (e.key === 'Tab') {
        const f = focusables(), i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      }
    });
    matchMedia('(min-width: 900px)').addEventListener('change', () => set(false));
  }

  function ConsoleHello() {
    console.log('%c●●● %c' + CONTENT.console, 'color:#E04A74;font-size:18px', 'font:600 13px sans-serif');
  }

  /* =====================================================================
     Boot
     ===================================================================== */
  renderHeader();
  renderHero();
  renderAbout();
  renderStack();
  renderCareer();
  renderTeam();
  renderProjects();
  renderContact();
  renderFooter();
  Thumbprint();
  NavState();
  MobileMenu();
  ClayLetters();
  ClayPortrait();
  PlaceOnTray();
  ClayEnvelope();
  ConsoleHello();
  StopMotion.start();
  document.addEventListener('visibilitychange', () => (document.hidden ? StopMotion.stop() : StopMotion.start()));
</script>
</body>
