<!doctype html>
<!--
  Prototype 04 — Sticker Sheet (`sticker-sheet`), LIGHT variant: "Fresh Sketchbook".
  Direction brief: docs/design/DIRECTIONS.md, section 04.

  Concept: a sheet of die-cut stickers on bright white sketchbook paper. Every piece of content
  is a real sticker type with its own vernacular: the name is one big die-cut sticker on glossy
  backing paper (peel its corner and the backing has "call me Ralph" pencilled on it), the
  section titles are die-cut labels, the career is printed on label-maker tape, the team quotes
  are "HELLO my name is" badges, the projects are shipping labels, and the contact section is a
  wall you can stick things on. Ralph's notes are in pencil. Thick black outlines, hard black
  shadows and flat summer colours (lime, sunshine yellow, sky blue, bubblegum pink).
  It shares only the style (neubrutalism, hand-drawn notes, stickers) with the dark variant,
  "Night Zine": no bento grid, no marker, no riso inks, no sticker book.

  Effects (each is a named function in the script below):
  - PeelBack ........... custom: the name sticker's corner folds back along a real fold line
                         (the perpendicular bisector between the corner and the pointer); the
                         sticker is clipped with clip-path and the folded flap is an SVG polygon
                         mirrored across that line. Drag the corner to peel, release to re-stick
                         with a spring.
  - StickerSlap ........ custom (IntersectionObserver + CSS keyframes): stickers are slapped onto
                         the sheet as they scroll into view, one after another
  - Pencil ............. custom: a seeded generator for sketchy double-stroke pencil lines,
                         plus an SVG grain filter so the strokes look like graphite
  - DymoTape ........... custom CSS: embossed label-maker tape (raised letters, crimped ends)
  - Barcode ............ custom SVG: a barcode generated from each project's name
  - SealBadge .......... inspired by React Bits CircularText, rebuilt as an SVG textPath that
                         turns with scroll
  - StickerWall ........ custom: click or tap the empty contact wall to stick a sticker there
  - IndexTabs .......... custom: notebook divider tabs as the navigation on wide screens
  - MobileMenu, ConsoleHello: custom

  Libraries in this file: none.
  Fonts: Gabarito (display and body, 400–900), Caveat (pencil notes), Rubik Mono One (label
  tape only), Google Fonts, latin-ext.
  React build would need: nothing beyond React.

  Reduced motion: the name sticker rests with a small static peel and snaps back without a
  spring, stickers are already in place (no slap), the seal does not turn, native anchor jumps.
  No WebGL, so no WebGL fallback is needed.

  Content: all copy lives in the CONTENT object at the top of the script. Additions beyond
  brief section 5 are marked `NEW CONTENT` there.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafał Ciećwierz, Frontend Engineer</title>
<meta name="description" content="Rafał Ciećwierz, Frontend Engineer. React & TypeScript, 5+ years building production apps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=Caveat:wght@500..700&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js');</script>
<style>
  :root {
    --paper: #FFFFFF;
    --dots: #DCDCE2;        /* sketchbook dot grid */
    --ink: #000000;         /* outlines, text and hard shadows */
    --pencil: #55555C;      /* pencil notes, 7.4:1 on white */
    --lime: #B8F03C;
    --yellow: #FFD52E;
    --sky: #86CCFF;
    --pink: #FF92CB;
    --backing: #EAF5FF;     /* glossy sticker backing paper */
    --backing-grid: #C9E2F7;
    --backing-print: #3A6E9C; /* print on the backing, 5.3:1 on backing */
    --bw: 3px;
    --gut: clamp(16px, 4vw, 40px);
    --tabs: 0px;
    --sans: 'Gabarito', system-ui, sans-serif;
    --hand: 'Caveat', 'Segoe Print', cursive;
    --tape: 'Rubik Mono One', 'Courier New', monospace;
  }
  @media (min-width: 1100px) { :root { --tabs: 128px; } }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 30px; }
  body {
    margin: 0; background-color: var(--paper); color: var(--ink);
    background-image: radial-gradient(var(--dots) 1.3px, transparent 1.6px); background-size: 26px 26px;
    font: 400 18px/1.55 var(--sans); overflow-x: clip; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  img, svg { display: block; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  p { margin: 0; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; box-shadow: 0 0 0 8px var(--lime); border-radius: 6px; }
  .vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: 12px; top: -60px; z-index: 200; padding: 10px 16px; background: var(--lime); border: var(--bw) solid var(--ink); border-radius: 8px; font-weight: 800; }
  .skip:focus { top: 12px; }

  .wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 calc(var(--gut) + var(--tabs)) 0 var(--gut); }

  /* ---------- Shared sticker look ---------- */
  .stk { border: var(--bw) solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 var(--ink); background: var(--c, var(--paper)); }
  .kiss { outline: 2px dashed #A9C9E6; outline-offset: 6px; }
  .note { font: 600 25px/1.05 var(--hand); color: var(--pencil); transform: rotate(var(--tilt, -2deg)); display: inline-block; }
  .pencil { position: absolute; overflow: visible; pointer-events: none; }
  .pencil path { fill: none; stroke: var(--pencil); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; filter: url(#graphite); }

  /* StickerSlap */
  .js .slap { opacity: 0; }
  .js .slap.in { animation: slap .5s cubic-bezier(.2, 1.4, .4, 1) var(--delay, 0s) both; }
  @keyframes slap {
    0% { opacity: 0; transform: scale(1.35) rotate(calc(var(--r, 0deg) + 9deg)); box-shadow: 18px 22px 0 rgba(0, 0, 0, .18); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: scale(1) rotate(var(--r, 0deg)); }
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 12px 24px;
    border: var(--bw) solid var(--ink); border-radius: 999px; box-shadow: 5px 5px 0 var(--ink);
    font: 800 19px/1 var(--sans); text-decoration: none; cursor: pointer; transition: transform .08s, box-shadow .08s;
  }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
  .btn:active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--ink); }
  .btn-primary { background: var(--lime); }
  .btn-secondary { background: var(--paper); }

  /* ---------- DymoTape ---------- */
  .dymo {
    --tc: var(--ink);
    display: inline-block; padding: 7px 16px 6px; background: var(--tc); color: #fff;
    font: 400 15px/1.2 var(--tape); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .55), 0 -1px 0 rgba(0, 0, 0, .55); /* embossed letters */
    background-image: linear-gradient(180deg, rgba(255, 255, 255, .16), transparent 40%, rgba(0, 0, 0, .14));
    clip-path: polygon(0 8%, 4px 0, calc(100% - 4px) 0, 100% 8%, calc(100% - 3px) 50%, 100% 92%, calc(100% - 4px) 100%, 4px 100%, 0 92%, 3px 50%);
    box-shadow: 3px 3px 0 rgba(0, 0, 0, .25); transform: rotate(var(--r, -1.5deg));
  }
  .dymo.pink { --tc: #C2186B; }
  .dymo.blue { --tc: #1D5FA8; }
  .dymo.green { --tc: #2F7A1F; }

  /* ---------- Header ---------- */
  .header { position: absolute; inset: 0 0 auto; z-index: 40; padding-top: 18px; }
  .header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { text-decoration: none; }
  .logo .dymo { font-size: 14px; }
  .menu-btn { display: inline-flex; align-items: center; height: 46px; padding: 0 18px; border: var(--bw) solid var(--ink); border-radius: 999px; background: var(--yellow); box-shadow: 3px 3px 0 var(--ink); font: 800 16px/1 var(--sans); cursor: pointer; }
  .menu {
    position: fixed; z-index: 60; inset: 76px var(--gut) auto; padding: 12px; background: var(--paper);
    border: var(--bw) solid var(--ink); border-radius: 18px; box-shadow: 7px 7px 0 var(--ink);
  }
  .menu a { display: block; padding: 12px 14px; border-radius: 10px; font: 800 26px/1 var(--sans); text-decoration: none; }
  .menu a:hover { background: var(--lime); }
  .mobile-bar { position: fixed; z-index: 55; inset: 0 0 auto; padding: 12px var(--gut); display: flex; justify-content: flex-end; pointer-events: none; }
  .mobile-bar .menu-btn { pointer-events: auto; }

  /* IndexTabs (wide screens) */
  .tabs { display: none; }
  @media (min-width: 1100px) {
    .mobile-bar, .menu { display: none !important; }
    .tabs { display: flex; flex-direction: column; gap: 6px; position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 50; }
    .tabs a {
      display: block; width: 132px; padding: 13px 16px 13px 18px; margin-right: -22px; text-decoration: none;
      background: var(--c); border: var(--bw) solid var(--ink); border-right: 0; border-radius: 14px 0 0 14px;
      font: 800 17px/1 var(--sans); box-shadow: -4px 4px 0 var(--ink); transition: margin-right .2s cubic-bezier(.3, 1.4, .5, 1);
    }
    .tabs a:hover, .tabs a[aria-current="true"] { margin-right: 0; }
    .tabs a[aria-current="true"] { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; }
  }

  /* ---------- Section titles: die-cut label stickers ---------- */
  .sec { padding: clamp(80px, 10vw, 140px) 0 0; position: relative; }
  .sec-head { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 26px; margin-bottom: clamp(30px, 4vw, 50px); }
  .title {
    margin: 0; padding: .08em .32em .14em; display: inline-block; background: var(--c, var(--paper));
    border: var(--bw) solid var(--ink); border-radius: .28em; box-shadow: 6px 6px 0 var(--ink);
    font: 900 clamp(46px, 7.5vw, 96px)/1 var(--sans); letter-spacing: -.035em; transform: rotate(var(--r, -1.5deg));
  }
  .sec-head .note { max-width: 34ch; }

  /* ---------- Hero ---------- */
  .hero { padding-top: 84px; }
  .sheet {
    position: relative; padding: clamp(18px, 3vw, 40px); border: var(--bw) solid var(--ink); border-radius: 26px;
    background-color: var(--backing);
    background-image: linear-gradient(var(--backing-grid) 1px, transparent 1px), linear-gradient(90deg, var(--backing-grid) 1px, transparent 1px);
    background-size: 28px 28px; background-position: -1px -1px;
  }
  .sheet-print { position: absolute; left: clamp(18px, 3vw, 40px); bottom: 10px; color: var(--backing-print); font: 700 12px/1 var(--sans); letter-spacing: .02em; }
  .peel-wrap { position: relative; container-type: inline-size; }
  .backing-note { position: absolute; right: 16px; bottom: 12px; font: 700 clamp(26px, 5cqi, 46px)/1 var(--hand); color: var(--backing-print); transform: rotate(-4deg); }
  .name-shadow, .name-sticker { border-radius: 30px; }
  .name-shadow { position: absolute; inset: 0; background: var(--ink); transform: translate(9px, 9px); }
  .name-sticker { position: relative; padding: clamp(14px, 3.4cqi, 40px) clamp(16px, 4cqi, 48px) clamp(18px, 3.8cqi, 44px); background: var(--yellow); border: 4px solid var(--ink); }
  .name { margin: 0; font: 900 clamp(48px, 19cqi, 240px)/.86 var(--sans); letter-spacing: -.05em; }
  .name span { display: block; }
  .name span + span { padding-left: .5em; }
  .flap { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .flap polygon { stroke: var(--ink); stroke-width: 3.5; stroke-linejoin: round; }
  .peel-handle { position: absolute; right: -10px; bottom: -10px; width: 120px; height: 110px; cursor: grab; touch-action: none; z-index: 3; }
  .peel-handle.is-down { cursor: grabbing; }
  .hero-row { display: grid; gap: 22px; margin-top: clamp(26px, 3.4vw, 40px); align-items: end; }
  @media (min-width: 820px) { .hero-row { grid-template-columns: 1.2fr 1fr; } }
  .role { display: inline-block; padding: 10px 20px; font: 800 clamp(24px, 3vw, 36px)/1 var(--sans); --c: var(--sky); border-radius: 999px; transform: rotate(-1deg); }
  .tagline { margin-top: 18px; font-size: clamp(18px, 1.6vw, 21px); font-weight: 500; }
  .ctas { position: relative; display: flex; flex-wrap: wrap; gap: 14px; justify-content: flex-start; }
  @media (min-width: 820px) { .ctas { justify-content: flex-end; } }
  .ctas .btn { flex: 1 1 200px; }
  @media (min-width: 820px) { .ctas .btn { flex: 0 0 auto; } }
  .cta-note { position: absolute; right: 8px; top: -54px; --tilt: 3deg; display: none; }
  .cta-note .pencil { left: -66px; top: 12px; width: 80px; height: 50px; }
  @media (min-width: 820px) { .cta-note { display: block; } }
  .avail { margin-top: 18px; font-weight: 600; color: var(--pencil); }

  /* ---------- About ---------- */
  .about-grid { display: grid; gap: 40px; align-items: start; }
  @media (min-width: 860px) { .about-grid { grid-template-columns: minmax(260px, 380px) 1fr; gap: 60px; } }
  .sketch { margin: 0; text-align: center; }
  .sketch svg { width: min(100%, 360px); height: auto; margin: 0 auto; }
  .sketch figcaption { margin-top: 6px; }
  .about-text p { max-width: 60ch; }
  .about-text p + p { margin-top: 16px; }
  .about-text p:first-child { font: 700 clamp(22px, 2.2vw, 28px)/1.35 var(--sans); }
  .rounds { display: flex; flex-wrap: wrap; gap: 26px; margin-top: 36px; align-items: center; }
  .round {
    display: grid; place-items: center; width: 184px; height: 184px; padding: 24px; border-radius: 50%; text-align: center;
    font: 800 19px/1.15 var(--sans); --r: -6deg;
  }
  .round strong { display: block; font: 900 36px/1 var(--sans); letter-spacing: -.03em; }
  .rounds .note { max-width: 22ch; }

  /* ---------- Stack: sticker sheets in columns ---------- */
  .legend { display: flex; flex-wrap: wrap; gap: 14px 26px; align-items: center; margin-bottom: 34px; font-weight: 600; }
  .legend li { display: flex; align-items: center; gap: 10px; }
  .sheets { columns: 1; column-gap: 28px; }
  @media (min-width: 720px) { .sheets { columns: 2; } }
  @media (min-width: 1180px) { .sheets { columns: 3; } }
  .group { break-inside: avoid; margin-bottom: 30px; border: var(--bw) solid var(--ink); border-radius: 20px; overflow: hidden; background: var(--paper); box-shadow: 6px 6px 0 var(--ink); }
  .group h3 { margin: 0; padding: 12px 20px; background: var(--c); border-bottom: var(--bw) solid var(--ink); font: 900 28px/1 var(--sans); letter-spacing: -.02em; }
  .group-body { display: flex; flex-wrap: wrap; gap: 14px 12px; align-items: center; padding: 22px 20px 24px; }
  .lvl { width: 100%; font: 700 21px/1 var(--hand); color: var(--pencil); margin-top: 4px; }
  .pill { display: inline-block; border: var(--bw) solid var(--ink); border-radius: 999px; font-weight: 800; line-height: 1.1; box-shadow: 3px 3px 0 var(--ink); transform: rotate(var(--r, 0deg)); }
  .pill.strong { background: var(--c); font-size: 19px; padding: 10px 16px; }
  .pill.medium { background: var(--paper); font-size: 17px; padding: 8px 14px; }
  .pill.low { background: var(--paper); font-size: 15px; padding: 6px 12px; border-style: dashed; box-shadow: none; }
  .legend .pill { --c: var(--yellow); }

  /* ---------- Career: label-maker tape + index cards ---------- */
  .jobs { display: grid; gap: 46px; }
  .job { display: grid; gap: 16px 34px; align-items: start; }
  @media (min-width: 900px) { .job { grid-template-columns: 300px 1fr; } }
  .job-tape { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding-top: 6px; }
  .job-tape .dymo:first-child { font-size: 17px; white-space: normal; max-width: 100%; line-height: 1.45; }
  @media (min-width: 900px) { .job-tape { position: sticky; top: 30px; } }
  .card {
    position: relative; padding: 26px clamp(18px, 3vw, 34px) 26px; border: var(--bw) solid var(--ink); border-radius: 16px; background: var(--paper);
    box-shadow: 6px 6px 0 var(--ink);
    background-image: linear-gradient(transparent 0 33px, #F2B8D3 33px 35px, transparent 35px), repeating-linear-gradient(transparent 0 31px, #D9E8F5 31px 32px);
    background-position: 0 0, 0 4px;
  }
  .card .roles { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 16px; font: 800 clamp(22px, 2.4vw, 28px)/1.2 var(--sans); letter-spacing: -.01em; }
  .card .roles .arrow { color: var(--pencil); }
  .promo { position: relative; display: inline-flex; align-items: center; gap: 8px; }
  .promo .star { width: 34px; height: 34px; position: relative; flex: none; }
  .promo .star .pencil { inset: 0; width: 100%; height: 100%; }
  .card ul.points { display: grid; gap: 8px; margin-bottom: 18px; }
  .card ul.points li { position: relative; padding-left: 24px; max-width: 70ch; font-size: 17px; }
  .card ul.points li::before { content: ''; position: absolute; left: 3px; top: .55em; width: 11px; height: 11px; border: 2px solid var(--ink); border-radius: 50%; background: var(--c); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags li { padding: 3px 10px; border: 2px solid var(--ink); border-radius: 999px; font-size: 14px; font-weight: 700; background: var(--paper); }
  .edu .card { background-image: none; border-style: dashed; box-shadow: none; }

  /* ---------- Team: HELLO my name is ---------- */
  .badges { display: grid; gap: 34px; }
  @media (min-width: 760px) { .badges { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1100px) { .badges { grid-template-columns: repeat(3, 1fr); } }
  .badge { margin: 0; overflow: hidden; border: var(--bw) solid var(--ink); border-radius: 20px; background: var(--paper); box-shadow: 6px 6px 0 var(--ink); }
  .badge-top { padding: 14px 18px 12px; background: var(--c); border-bottom: var(--bw) solid var(--ink); text-align: center; }
  .badge-top b { display: block; font: 900 44px/.9 var(--sans); letter-spacing: -.02em; }
  .badge-top span { font-weight: 700; font-size: 16px; }
  .badge-name { padding: 14px 18px 4px; text-align: center; font: 700 44px/1 var(--hand); border-bottom: 2px solid #E3E3E8; }
  .badge blockquote { margin: 0; padding: 18px 22px 8px; font-size: 18px; line-height: 1.5; font-weight: 500; }
  .badge blockquote p + p { margin-top: 10px; }
  .badge figcaption { padding: 6px 22px 20px; color: var(--pencil); font-size: 15px; font-weight: 600; }

  /* ---------- Projects: shipping labels ---------- */
  .labels { display: grid; gap: 34px 30px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
  .label { position: relative; display: flex; flex-direction: column; border: var(--bw) solid var(--ink); border-radius: 12px; background: var(--paper); box-shadow: 6px 6px 0 var(--ink); }
  .label-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; background: var(--c); border-bottom: var(--bw) solid var(--ink); border-radius: 9px 9px 0 0; font: 900 14px/1 var(--sans); letter-spacing: .06em; }
  .label-body { padding: 16px 16px 18px; display: flex; flex-direction: column; flex: 1; }
  .field { font: 700 11.5px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--pencil); margin-bottom: 6px; }
  .label h3 { margin: 0 0 14px; font: 900 27px/1.05 var(--sans); letter-spacing: -.02em; }
  .label .sub { margin: -6px 0 14px; font: 600 21px/1.15 var(--hand); color: var(--pencil); }
  .label .desc { font-size: 16px; line-height: 1.5; margin-bottom: 16px; }
  .label .tags { margin-bottom: 16px; }
  .label-foot { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-top: auto; padding-top: 14px; border-top: 2px dashed var(--ink); }
  .barcode { width: 120px; height: 44px; flex: none; }
  .label-foot a { font-weight: 800; }
  .foot-r { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .stamp {
    display: inline-block; padding: 6px 12px; border: 3px solid var(--sc); border-radius: 8px; color: var(--sc);
    font: 400 15px/1 var(--tape); text-transform: uppercase; white-space: nowrap; transform: rotate(-9deg); background: rgba(255, 255, 255, .8);
  }
  .label.blank { border-style: dashed; box-shadow: none; display: grid; place-items: center; min-height: 340px; text-align: center; background: transparent; }

  /* ---------- Contact: sticker wall ---------- */
  .wall { position: relative; padding-bottom: 30px; }
  .contact-grid { display: grid; gap: 34px; align-items: center; }
  @media (min-width: 900px) { .contact-grid { grid-template-columns: 1fr auto; } }
  .contact-lead { font: 800 clamp(24px, 3vw, 36px)/1.2 var(--sans); max-width: 26ch; letter-spacing: -.01em; }
  .email-stk {
    display: inline-block; margin: 26px 0 30px; padding: .3em .7em .36em; --c: var(--pink); border-radius: 999px;
    font: 900 clamp(20px, 4.2vw, 56px)/1 var(--sans); letter-spacing: -.03em; text-decoration: none; overflow-wrap: anywhere; transform: rotate(-1.5deg);
  }
  .email-stk:hover { background: var(--yellow); }
  .contact-actions { display: flex; flex-wrap: wrap; gap: 14px; }
  .contact-links { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 26px; font-weight: 700; }
  .contact-links .todo { color: var(--pencil); font-weight: 600; }
  .seal { width: clamp(180px, 22vw, 260px); justify-self: center; }
  .seal svg { width: 100%; height: auto; overflow: visible; }
  .seal-text { font: 800 14px var(--sans); letter-spacing: .1em; text-transform: uppercase; }
  .wall-note { margin-top: 44px; }
  .wall-area { position: absolute; inset: 0; z-index: 0; }
  .wall > .wrap { position: relative; z-index: 1; }
  .placed { position: absolute; z-index: 2; pointer-events: none; display: grid; place-items: center; animation: slap .45s cubic-bezier(.2, 1.4, .4, 1) both; transform: rotate(var(--r)); }

  /* ---------- Footer ---------- */

    const f = (n) => n.toFixed(1);
    function smooth(pts) {
      let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
      for (let i = 1; i < pts.length - 1; i++) d += ` Q${f(pts[i][0])} ${f(pts[i][1])} ${f((pts[i][0] + pts[i + 1][0]) / 2)} ${f((pts[i][1] + pts[i + 1][1]) / 2)}`;
      const l = pts[pts.length - 1];
      return d + ` L${f(l[0])} ${f(l[1])}`;
    }
    // Each line is drawn twice with a little jitter, the way a pencil goes over a line again
    function twice(points, seed, j = 1.4) {
      const r = rng(seed);
      return [0, 1].map(() => smooth(points.map(([x, y]) => [x + (r() - .5) * j * 2, y + (r() - .5) * j * 2])));
    }
    function arrow(x1, y1, x2, y2, bend, seed) {
      const pts = [], mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
      const cx = mx - dy / len * bend, cy = my + dx / len * bend;
      for (let i = 0; i <= 10; i++) { const t = i / 10, u = 1 - t; pts.push([u * u * x1 + 2 * u * t * cx + t * t * x2, u * u * y1 + 2 * u * t * cy + t * t * y2]); }
      const a = Math.atan2(y2 - cy, x2 - cx), h = 11;
      const head = [[x2 - Math.cos(a - .55) * h, y2 - Math.sin(a - .55) * h], [x2, y2], [x2 - Math.cos(a + .55) * h, y2 - Math.sin(a + .55) * h]];
      return [...twice(pts, seed), ...twice(head, seed + 1, .8)];
    }
    function star(cx, cy, rad, seed) {
      const pts = [];
      for (let i = 0; i <= 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? rad * .45 : rad; pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }

  // Barcode (custom SVG): decorative bars generated from the project name
  function barcode(name) {
    let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) | 0;
    const r = rng(h); let x = 0, bars = '';
    while (x < 116) { const w = 1 + Math.floor(r() * 3.2); if (r() > .38) bars += `<rect x="${x}" width="${w}" height="44"/>`; x += w + 1 + Math.floor(r() * 2); }
    return `<svg class="barcode" viewBox="0 0 120 44" aria-hidden="true" focusable="false"><g fill="var(--ink)">${bars}</g></svg>`;
  }

  /* =====================================================================
     Effects (one function per effect = one hook or component later)
     ===================================================================== */

  // PeelBack (custom): fold the name sticker's corner along a real fold line.
  // C is the bottom-right corner, T is where the corner tip is pulled to. The fold line is the
  // perpendicular bisector of C–T. The sticker keeps the half on the far side of the line; the
  // half near C is mirrored across the line and drawn as the flap (the sticker's back).
  function PeelBack() {
    const wrap = $('#peelWrap'), sticker = $('#nameSticker'), shadow = $('#nameShadow');
    const flap = $('#flap'), poly = $('#flapPoly'), polyShadow = $('#flapShadow'), grad = $('#flapGrad'), handle = $('#peelHandle');
    let W = 0, H = 0, tip = [0, 0], vel = [0, 0], target = [0, 0], raf = 0, dragging = false;
    const idle = () => [W - Math.min(70, W * .08), H - Math.min(56, H * .16)];
    const hover = () => [W - Math.min(150, W * .16), H - Math.min(110, H * .3)];

    function clipHalf(rect, M, n, keepFar) { // Sutherland–Hodgman against one half-plane
      const side = (p) => ((p[0] - M[0]) * n[0] + (p[1] - M[1]) * n[1]) * (keepFar ? -1 : 1);
      const out = [];
      rect.forEach((A, i) => {
        const B = rect[(i + 1) % rect.length], a = side(A), b = side(B);
        if (a >= 0) out.push(A);
        if ((a >= 0) !== (b >= 0)) { const t = a / (a - b); out.push([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t]); }
      });
      return out;
    }
    function draw() {
      const C = [W, H], d = [C[0] - tip[0], C[1] - tip[1]], len = Math.hypot(d[0], d[1]);
      if (len < 1) { sticker.style.clipPath = shadow.style.clipPath = ''; poly.setAttribute('points', ''); polyShadow.setAttribute('points', ''); return; }
      const n = [d[0] / len, d[1] / len], M = [(C[0] + tip[0]) / 2, (C[1] + tip[1]) / 2];
      const rect = [[0, 0], [W, 0], [W, H], [0, H]];
      const kept = clipHalf(rect, M, n, true), cut = clipHalf(rect, M, n, false);
      const mirror = cut.map((p) => { const k = 2 * ((p[0] - M[0]) * n[0] + (p[1] - M[1]) * n[1]); return [p[0] - k * n[0], p[1] - k * n[1]]; });
      const css = 'polygon(' + kept.map((p) => `${p[0].toFixed(1)}px ${p[1].toFixed(1)}px`).join(',') + ')';
      sticker.style.clipPath = css;
      shadow.style.clipPath = css; // same shape, the shadow element is offset by its transform
      const pts = (arr, dx = 0, dy = 0) => arr.map((p) => `${(p[0] + dx).toFixed(1)},${(p[1] + dy).toFixed(1)}`).join(' ');
      poly.setAttribute('points', pts(mirror));
      polyShadow.setAttribute('points', pts(mirror, -n[0] * 8, -n[1] * 8 + 4));
      grad.setAttribute('x1', M[0]); grad.setAttribute('y1', M[1]); grad.setAttribute('x2', tip[0]); grad.setAttribute('y2', tip[1]);
    }
    function step() { // a damped spring towards the target
      if (reduceMotion) { tip = target.slice(); draw(); raf = 0; return; }
      vel = vel.map((v, i) => (v + (target[i] - tip[i]) * .16) * .72);
      tip = tip.map((t, i) => t + vel[i]);
      draw();
      raf = Math.hypot(vel[0], vel[1]) + Math.hypot(target[0] - tip[0], target[1] - tip[1]) > .2 ? requestAnimationFrame(step) : 0;
    }
    const go = (t) => { target = t; if (!raf) raf = requestAnimationFrame(step); };
    function measure() {
      W = sticker.offsetWidth; H = sticker.offsetHeight;
      flap.setAttribute('width', W); flap.setAttribute('height', H); flap.setAttribute('viewBox', `0 0 ${W} ${H}`);
      tip = idle(); target = tip.slice(); draw();
    }
    new ResizeObserver(measure).observe(sticker);

    handle.addEventListener('pointerenter', () => { if (!dragging) go(hover()); });
    handle.addEventListener('pointerleave', () => { if (!dragging) go(idle()); });
    handle.addEventListener('pointerdown', (e) => { dragging = true; try { handle.setPointerCapture(e.pointerId); } catch (_) { /* synthetic events */ } handle.classList.add('is-down'); });
    handle.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const r = sticker.getBoundingClientRect();
      let p = [e.clientX - r.left, e.clientY - r.top];
      const C = [W, H], dx = p[0] - C[0], dy = p[1] - C[1], dist = Math.hypot(dx, dy), max = Math.min(W * .62, H * 1.5);
      if (dist > max) p = [C[0] + dx / dist * max, C[1] + dy / dist * max]; // never peel more than about half
      go(p);
    });
    const release = () => { if (!dragging) return; dragging = false; handle.classList.remove('is-down'); go(idle()); };
    handle.addEventListener('pointerup', release);
    handle.addEventListener('pointercancel', release);
  }

  // StickerSlap (custom): stickers land on the sheet as they enter the viewport
  function StickerSlap() {
    const all = $$('.slap');
    if (reduceMotion || !('IntersectionObserver' in window)) { all.forEach((el) => el.classList.add('in')); return; }
    const io = new IntersectionObserver((entries) => entries.forEach((en) => {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    }), { rootMargin: '0px 0px -8% 0px' });
    all.forEach((el) => io.observe(el));
  }

  // SealBadge (inspired by React Bits CircularText): the ring of text turns with scroll
  function SealBadge() {
    if (reduceMotion) return;
    const spin = $('#sealSpin');
    addEventListener('scroll', () => { spin.style.transform = `rotate(${(scrollY * .12) % 360}deg)`; }, { passive: true });
  }

  // StickerWall (custom): click or tap empty space in Contact to stick a sticker there
  function StickerWall() {
    const section = $('#contact'), area = $('#wallArea'), S = CONTENT.wallStickers;
    let n = 0;
    section.addEventListener('click', (e) => {
      if (e.target.closest('a, button')) return;
      const r = section.getBoundingClientRect();
      const s = S[n % S.length], c = COLOURS[n % 4], size = s.length > 3 ? 'auto' : '58px';
      const el = document.createElement('span');
      el.className = 'placed stk';
      el.textContent = s;
      el.style.cssText = `left:${e.clientX - r.left - 28}px;top:${e.clientY - r.top - 24}px;--c:${c};--r:${((Math.random() - .5) * 30).toFixed(1)}deg;min-width:${size};height:52px;padding:0 14px;border-radius:${s.length > 3 ? '999px' : '50%'};font:900 22px/1 var(--sans)`;
      area.appendChild(el);
      if (area.children.length > 30) area.firstElementChild.remove();
      n++;
    });
  }

  function IndexTabs() {
    const links = $$('#tabs a');
    const io = new IntersectionObserver((entries) => entries.forEach((en) => {
      if (!en.isIntersecting) return;
      links.forEach((a) => (a.dataset.nav === en.target.id ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current')));
    }), { rootMargin: '-45% 0px -50% 0px' });
    ['top', ...CONTENT.nav.map((n) => n.id)].forEach((id) => io.observe(document.getElementById(id)));
  }

  function MobileMenu() {
    const btn = $('#menuBtn'), menu = $('#menu');
    const focusables = () => [btn, ...$$('a', menu)];
    function set(open) {
      menu.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
      btn.textContent = open ? 'Close' : 'Menu';
      document.documentElement.style.overflow = open ? 'hidden' : '';
      if (open) $('a', menu).focus();
    }
    btn.addEventListener('click', () => set(menu.hidden));
    menu.addEventListener('click', (e) => { if (e.target.closest('a')) set(false); });
    document.addEventListener('keydown', (e) => {
      if (menu.hidden) return;
      if (e.key === 'Escape') { set(false); btn.focus(); }
      if (e.key === 'Tab') {
        const f = focusables(), i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      }
    });
    matchMedia('(min-width: 1100px)').addEventListener('change', () => set(false));
  }

  function ConsoleHello() {
    console.log('%c RC %c ' + CONTENT.console, 'background:#FFD52E;color:#000;border:2px solid #000;border-radius:4px;font:900 14px sans-serif', 'font:600 13px sans-serif');
  }

  /* =====================================================================
     Boot
     ===================================================================== */
  renderNav();
  renderHero();
  renderAbout();
  renderStack();
  renderCareer();
  renderTeam();
  renderProjects();
  renderContact();
  renderFooter();
  PeelBack();
  StickerSlap();
  SealBadge();
  StickerWall();
  IndexTabs();
  MobileMenu();
  ConsoleHello();
</script>
