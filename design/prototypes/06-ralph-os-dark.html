<!doctype html>
<!--
  Prototype 06 — RalphOS (`ralph-os`), DARK variant: "Midnight".
  Direction brief: docs/design/DIRECTIONS.md, section 06.

  Concept: the site is a desktop operating system, RalphOS, at night. It boots straight into a
  Welcome window that already holds the name, role, tagline and both CTAs. Every section of the
  brief is an app in the dock: About, Stack (a settings panel), Career (a timeline), Team (a
  messages app with the team's quotes), Projects (a file browser with folders) and Contact (a
  mail composer). CV.pdf is a file on the desktop. Windows drag (with inertia), stack, minimise
  into the dock, maximise, snap to the top edge and resize, and all of it works from the
  keyboard. A Terminal and the Trash are the easter eggs. A "List" switch in the menu bar turns
  the same markup into a plain scrolling page, and below 900 px the desktop becomes a phone home
  screen whose apps open as full-screen sheets.
  It shares only the style (OS metaphor, glass, playful interaction) with the light variant,
  "Daylight": no Spotlight, no notifications stack, no Outfit or Plus Jakarta Sans.

  Effects (each is a named function in the script below):
  - AuroraWallpaper .... custom raw WebGL fragment shader (curtains of teal and violet light),
                         rendered at reduced resolution and 30 fps, started after first paint
  - WindowManager ...... custom: open, close, focus and z-order, drag with inertia, snap to the
                         top edge to maximise, resize, minimise; keyboard: Esc closes,
                         Alt + arrows move, Alt + Shift + arrows resize
  - OpenFromIcon / Genie custom (Web Animations API): windows grow out of their dock icon and
                         are sucked back into it when minimised
  - DockMagnify ........ React Bits Dock, ported from `motion` to plain pointer events + rAF
                         springs (no dependency)
  - GlassRim ........... custom, inspired by React Bits GlassSurface: a specular rim on the
                         focused window that turns towards the cursor
  - SettingsTabs ....... custom (ARIA tabs) for the Stack app
  - TimelineDraw ....... custom: the career line fills as the window (or page) scrolls
  - MessagesTyping ..... custom: the team's messages arrive one by one with a typing indicator
  - FinderFolders ...... React Bits Folder, ported to CSS (the folder opens, papers peek out)
  - MailComposer ....... custom: builds a mailto: link; nothing is sent anywhere else
  - Terminal ........... custom easter egg: help, whoami, ls, open, stack, career, cv, contact,
                         sudo hire ralph, clear, exit; history and Tab completion
  - Trash .............. custom easter egg: what was replaced in production
  - NotificationToast, MenuClock, ViewMode, PhoneSheets (swipe down to close), ConsoleHello:
                         custom

  Libraries in this file: none. WebGL is a plain context, no three.js.
  Fonts: Manrope (UI, 400–800) and JetBrains Mono (Terminal only), Google Fonts, latin-ext.
  React build would need: nothing beyond React. The window manager is a reducer plus a pointer
  hook; the wallpaper is a small WebGL hook, lazy-loaded.

  Reduced motion: no open, close or minimise animation, no inertia, no dock magnification
  springs, a single still frame of the aurora, all messages already shown, the timeline line
  fully drawn, native anchor jumps in list view. If WebGL fails, a CSS gradient wallpaper is
  shown instead.

  Content: all copy lives in the CONTENT object at the top of the script. Additions beyond
  brief section 5 are marked `NEW CONTENT` there.
-->

<style>
  :root {
    --midnight: #060912;     /* the wallpaper behind everything */
    --glass: rgba(15, 20, 37, .78);      /* window body */
    --glass-hi: rgba(20, 27, 50, .86);   /* focused window */
    --bar: rgba(255, 255, 255, .04);
    --line: rgba(255, 255, 255, .11);
    --line-hi: rgba(255, 255, 255, .22);
    --text: #EEF2FA;
    --muted: #A9B2C6;        /* 8:1 on the glass */
    --lilac: #B69CFF;        /* primary fills; ink on it */
    --teal: #3EE6C8;         /* status, focus, the aurora */
    --amber: #FFC45C;
    --rose: #FF8FA8;
    --ink: #0A0718;          /* text on lilac and teal */
    --close: #FF5F57; --min: #FEBC2E; --max: #28C840;
    --menubar: 30px;
    --dock-h: 88px;
    --r-win: 14px;
    --ui: 'Manrope', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--midnight); color: var(--text);
    font: 400 15px/1.55 var(--ui); font-feature-settings: 'ss01';
    -webkit-font-smoothing: antialiased;
  }
  body.mode-desktop { overflow: hidden; height: 100vh; height: 100dvh; }
  body.sheet-open { overflow: hidden; }
  a { color: var(--lilac); text-underline-offset: 3px; }
  a:hover { color: #D3C4FF; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .todo { color: var(--amber); font-weight: 700; }
  h1, h2, h3 { margin: 0; letter-spacing: -.01em; }

  .skip { position: fixed; left: 12px; top: -60px; z-index: 9999; background: var(--lilac); color: var(--ink); padding: 10px 14px; border-radius: 10px; font-weight: 700; text-decoration: none; }
  .skip:focus { top: 12px; }
  .skip + .skip:focus { top: 60px; }

  /* ---------- wallpaper ---------- */
  .wallpaper { position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background:
      radial-gradient(60% 45% at 30% 38%, rgba(40, 200, 175, .30), transparent 70%),
      radial-gradient(55% 50% at 72% 30%, rgba(125, 90, 255, .32), transparent 70%),
      radial-gradient(80% 60% at 50% 110%, rgba(20, 40, 90, .6), transparent 70%),
      linear-gradient(#070B18, #04060D);
  }
  .wallpaper canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.2s ease; }
  .wallpaper canvas.ready { opacity: 1; }
  .wallpaper::after { /* fine star dust, drawn in CSS so it stays sharp at any canvas resolution */
    content: ''; position: absolute; inset: 0; opacity: .5; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 33% 9%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 58% 14%, #dfe6ff 50%, transparent 51%),
      radial-gradient(1px 1px at 81% 7%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 91% 22%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 7% 41%, #cfe 50%, transparent 51%),
      radial-gradient(1px 1px at 46% 27%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 69% 33%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 24% 30%, #fff 50%, transparent 51%);
  }
  .mode-list .wallpaper canvas { display: none; }

  /* ---------- menu bar ---------- */
  .menubar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--menubar); z-index: 5000;
    display: flex; align-items: center; gap: 4px; padding: 0 10px;
    background: rgba(8, 11, 22, .55); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .mb-logo { display: flex; align-items: center; gap: 8px; padding: 0 8px; height: 22px; border-radius: 6px; font-weight: 800; letter-spacing: -.01em; color: var(--text); text-decoration: none; }
  .mb-logo i { width: 16px; height: 16px; border-radius: 5px; background: conic-gradient(from 200deg, var(--teal), var(--lilac), var(--teal)); display: inline-block; box-shadow: 0 0 10px rgba(62, 230, 200, .5); }
  .mb-app { font-weight: 800; padding: 0 8px; }
  .mb-nav { display: none; gap: 2px; }
  .mb-nav a { color: var(--text); text-decoration: none; padding: 3px 9px; border-radius: 6px; font-weight: 600; }
  .mb-nav a:hover { background: rgba(255, 255, 255, .08); }
  .mb-spacer { flex: 1; }
  .mb-status { display: flex; align-items: center; gap: 7px; color: var(--muted); padding: 0 8px; white-space: nowrap; }
  .mb-status b { color: var(--text); font-weight: 600; }
  .dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 3px rgba(62, 230, 200, .18); }
  .mb-clock { font-variant-numeric: tabular-nums; padding: 0 8px; font-weight: 600; white-space: nowrap; }
  .view-switch { display: flex; padding: 2px; gap: 2px; border-radius: 7px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); }
  .view-switch button { border: 0; background: transparent; padding: 1px 9px; border-radius: 5px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .view-switch button[aria-pressed="true"] { background: rgba(255, 255, 255, .14); color: var(--text); }

  /* ---------- desktop: icons, footer watermark, snap preview ---------- */
  .desk-icons { position: fixed; top: calc(var(--menubar) + 18px); right: 18px; z-index: 2; display: flex; flex-direction: column; gap: 14px; list-style: none; margin: 0; padding: 0; }
  .desk-icon { width: 84px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 4px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 12px; font-weight: 700; text-align: center; border: 1px solid transparent; background: none; text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }
  .desk-icon:hover { background: rgba(255, 255, 255, .07); border-color: var(--line); color: var(--text); }
  .desk-icon svg { width: 46px; height: 54px; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .5)); }
  .snap-preview { position: fixed; z-index: 3; left: 8px; right: 8px; top: calc(var(--menubar) + 8px); bottom: calc(var(--dock-h) + 8px); border-radius: var(--r-win); border: 1px solid rgba(182, 156, 255, .6); background: rgba(182, 156, 255, .10); backdrop-filter: blur(6px); opacity: 0; transform: scale(.97); transition: opacity .18s, transform .18s; pointer-events: none; }
  .snap-preview.on { opacity: 1; transform: none; }
  .site-footer { position: fixed; left: 16px; bottom: 14px; z-index: 1; max-width: 230px; font-size: 12px; line-height: 1.5; color: var(--muted); text-shadow: 0 1px 6px rgba(0, 0, 0, .9); }
  .site-footer p { margin: 0; }
  @media (max-width: 1239px) { .mode-desktop .site-footer { bottom: calc(var(--dock-h) + 8px); } }
  .site-footer a { color: var(--text); }

  /* ---------- windows ---------- */
  .win { position: fixed; top: 0; left: 0; z-index: 10; display: none; flex-direction: column;
    min-width: 300px; max-width: calc(100vw - 16px);
    background: var(--glass); border-radius: var(--r-win);
    backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .10), 0 18px 50px -10px rgba(0, 0, 0, .65);
    transform-origin: 0 0; will-change: transform;
  }
  .win.is-open { display: flex; }
  .win.is-min { display: none; }
  .win.is-focused { background: var(--glass-hi); box-shadow: 0 0 0 1px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .14), 0 30px 80px -12px rgba(0, 0, 0, .8), 0 0 60px -20px rgba(130, 100, 255, .35); }
  .win.is-sizing { transition: transform .32s cubic-bezier(.2, .8, .2, 1), width .32s cubic-bezier(.2, .8, .2, 1), height .32s cubic-bezier(.2, .8, .2, 1); }
  /* GlassRim: a specular rim drawn as a masked conic gradient; --rim turns towards the cursor */
  .win::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: conic-gradient(from var(--rim, 210deg), rgba(255, 255, 255, .55), rgba(255, 255, 255, .06) 22%, rgba(62, 230, 200, .25) 40%, rgba(255, 255, 255, .04) 60%, rgba(182, 156, 255, .35) 80%, rgba(255, 255, 255, .55));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .5; transition: opacity .3s;
  }
  .win.is-focused::before { opacity: 1; }
  .win-bar { position: relative; flex: none; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--bar); border-radius: var(--r-win) var(--r-win) 0 0; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
  .win-bar:active { cursor: grabbing; }
  .lights { display: flex; gap: 8px; flex: none; }
  .light { width: 13px; height: 13px; border-radius: 50%; border: 0; padding: 0; position: relative; display: grid; place-items: center; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .35); }
  .light::after { content: ''; position: absolute; inset: -6px; } /* a bigger hit area */
  .light svg { width: 7px; height: 7px; opacity: 0; stroke: rgba(0, 0, 0, .65); stroke-width: 1.6; fill: none; }
  .lights:hover .light svg, .light:focus-visible svg { opacity: 1; }
  .l-close { background: var(--close); } .l-min { background: var(--min); } .l-max { background: var(--max); }
  .win:not(.is-focused) .light { background: rgba(255, 255, 255, .18); }
  .win:not(.is-focused) .lights:hover .l-close { background: var(--close); }
  .win:not(.is-focused) .lights:hover .l-min { background: var(--min); }
  .win:not(.is-focused) .lights:hover .l-max { background: var(--max); }
  .win-title { flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: center; gap: 8px; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 60px; }
  .win-title small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .win-title:focus { outline: none; }
  .win-title:focus-visible { outline: 2px solid var(--teal); outline-offset: -1px; border-radius: 7px; }
  .win-body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 22px 24px 26px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .2) transparent; }
  .win-resize { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none; border-radius: 0 0 var(--r-win) 0; }
  .win-resize::after { content: ''; position: absolute; right: 5px; bottom: 5px; width: 7px; height: 7px; border-right: 2px solid var(--line-hi); border-bottom: 2px solid var(--line-hi); border-radius: 0 0 3px 0; }
  .win.is-max .win-resize { display: none; }

  /* ---------- buttons, tags ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 11px; font-weight: 800; font-size: 15px; text-decoration: none; border: 1px solid transparent; transition: transform .15s, background .15s, box-shadow .15s; white-space: nowrap; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--lilac); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 8px 24px -8px rgba(182, 156, 255, .8); }
  .btn-primary:hover { background: #C8B4FF; color: var(--ink); }
  .btn-glass { background: rgba(255, 255, 255, .07); color: var(--text); border-color: var(--line-hi); }
  .btn-glass:hover { background: rgba(255, 255, 255, .13); color: var(--text); }
  .btn svg { width: 17px; height: 17px; }
  .tags { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .tags li { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); color: #D5DBE8; }
  .eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }

  /* ---------- Welcome (hero) ---------- */
  .welcome .win-body { padding: 34px 40px 34px; }
  .wel-top { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .wel-mark { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: var(--ink); background: linear-gradient(140deg, var(--teal), var(--lilac)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 8px 22px -6px rgba(62, 230, 200, .6); }
  .wel-name { font-size: clamp(2.3rem, 4.4vw, 4rem); line-height: 1; font-weight: 800; letter-spacing: -.035em; }
  .wel-name span { display: block; }
  .wel-name .surname { background: linear-gradient(100deg, #FFFFFF 10%, #CFC1FF 55%, #8FF3DF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .08em; }
  .wel-role { margin: 16px 0 4px; font-size: clamp(1.15rem, 1.8vw, 1.45rem); font-weight: 700; }
  .wel-tag { margin: 0; color: var(--muted); font-size: 15px; }
  .wel-ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .wel-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 26px -40px -34px; padding: 14px 40px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); border-radius: 0 0 var(--r-win) var(--r-win); background: rgba(255, 255, 255, .025); }
  .wel-foot .chip { display: inline-flex; align-items: center; gap: 7px; color: var(--text); font-weight: 600; }

  /* ---------- About ---------- */
  .about-grid { display: grid; grid-template-columns: 170px 1fr; gap: 26px; align-items: start; }
  .avatar { width: 150px; height: 150px; border-radius: 50%; display: block; margin: 0 auto; box-shadow: 0 0 0 4px rgba(255, 255, 255, .06), 0 12px 30px -8px rgba(0, 0, 0, .6); }
  .avatar-cap { text-align: center; font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .about-name { font-size: 24px; font-weight: 800; }
  .about-ver { margin: 2px 0 14px; color: var(--muted); font-size: 13px; }
  .spec { margin: 0 0 18px; display: grid; grid-template-columns: max-content 1fr; gap: 5px 16px; font-size: 13.5px; }
  .spec dt { color: var(--muted); font-weight: 600; text-align: right; }
  .spec dd { margin: 0; font-weight: 600; }
  .about-text p { margin: 0 0 12px; color: #DCE1EC; }
  .about-text p:last-child { margin: 0; }

  /* ---------- Stack (settings) ---------- */
  .settings { display: grid; grid-template-columns: 180px 1fr; min-height: 100%; }
  .stack .win-body { padding: 0; }
  .set-side { border-right: 1px solid var(--line); padding: 14px 10px; background: rgba(0, 0, 0, .14); display: flex; flex-direction: column; gap: 2px; }
  .set-search { margin: 0 4px 10px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .set-tab { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: transparent; padding: 7px 9px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--text); }
  .set-tab:hover { background: rgba(255, 255, 255, .06); }
  .set-tab[aria-selected="true"] { background: rgba(182, 156, 255, .22); }
  .set-tab i { width: 22px; height: 22px; border-radius: 6px; flex: none; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; color: var(--ink); }
  .set-tab small { margin-left: auto; color: var(--muted); font-size: 12px; }
  .set-main { padding: 20px 24px 24px; }
  .set-panel h3 { font-size: 20px; font-weight: 800; }
  .set-sum { margin: 2px 0 14px; color: var(--muted); font-size: 13px; }
  .set-list { list-style: none; margin: 0; padding: 0; border-radius: 12px; background: rgba(255, 255, 255, .035); border: 1px solid var(--line); }
  .set-row { display: grid; grid-template-columns: 1fr auto 62px; align-items: center; gap: 14px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
  .set-row + .set-row { border-top: 1px solid var(--line); }
  .set-panel.animate .set-row { animation: rowIn .42s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 35ms); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } }
  .seg { display: flex; padding: 2px; gap: 2px; border-radius: 8px; background: rgba(0, 0, 0, .3); border: 1px solid var(--line); }
  .seg i { width: 34px; height: 14px; border-radius: 5px; background: rgba(255, 255, 255, .07); }
  .seg[data-level="low"] i:nth-child(-n+1), .seg[data-level="medium"] i:nth-child(-n+2), .seg[data-level="strong"] i { background: linear-gradient(180deg, #CDBBFF, #9E80FF); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5); }
  .seg[data-level="strong"] i { background: linear-gradient(180deg, #7FF5E0, #2FCFB3); }
  .lvl { font-size: 12.5px; color: var(--muted); font-weight: 700; text-align: right; }
  .lvl[data-level="strong"] { color: var(--teal); }
  .set-legend { margin: 16px 2px 0; display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 12.5px; }
  .set-legend span { display: inline-flex; align-items: center; gap: 8px; }
  .set-legend .seg i { width: 12px; height: 8px; }

  /* ---------- Career (timeline) ---------- */
  .tl { position: relative; list-style: none; margin: 4px 0 0; padding: 0 0 0 34px; }
  .tl-track, .tl-fill { position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; }
  .tl-track { background: rgba(255, 255, 255, .1); }
  .tl-fill { background: linear-gradient(var(--teal), var(--lilac)); transform-origin: top; transform: scaleY(var(--p, 0)); box-shadow: 0 0 12px rgba(62, 230, 200, .6); }
  .tl-item { position: relative; padding: 0 0 26px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-dot { position: absolute; left: -31px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--midnight); border: 2px solid rgba(255, 255, 255, .3); transition: border-color .3s, box-shadow .3s; }
  .tl-item.lit .tl-dot { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(62, 230, 200, .16); }
  .tl-item.promo.lit .tl-dot { border-color: var(--lilac); box-shadow: 0 0 0 4px rgba(182, 156, 255, .2); }
  .tl-dates { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tl-co { font-size: 19px; font-weight: 800; margin-top: 2px; }
  .tl-role { margin: 3px 0 8px; font-weight: 700; color: #DDE2EE; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .tl-role .arrow { color: var(--lilac); font-weight: 800; }
  .badge-promo { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800; letter-spacing: .02em; padding: 2px 8px 2px 6px; border-radius: 99px; background: rgba(182, 156, 255, .18); color: #D9CCFF; border: 1px solid rgba(182, 156, 255, .45); }
  .tl-item ul.points { margin: 0; padding-left: 18px; color: #D3D9E6; font-size: 14px; }
  .tl-item ul.points li { margin: 0 0 5px; }
  .tl-edu { margin-top: 26px; padding: 14px 16px; border-radius: 12px; border: 1px dashed var(--line-hi); font-size: 14px; }
  .tl-edu b { display: block; }
  .tl-edu span { color: var(--muted); }

  /* ---------- Team (messages) ---------- */
  .team .win-body { padding: 18px 18px 22px; }
  .chat-head { text-align: center; margin: 0 0 14px; }
  .chat-head h3 { font-size: 15px; font-weight: 800; }
  .chat-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
  .chat { display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; }
  .msg { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: end; margin: 0; }
  .msg .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--ink); }
  .msg .bubbles { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; }
  .msg blockquote { margin: 0; padding: 9px 13px; border-radius: 18px 18px 18px 6px; background: rgba(255, 255, 255, .09); border: 1px solid var(--line); font-size: 14.5px; line-height: 1.45; max-width: 100%; }
  .msg figcaption { font-size: 12px; color: var(--muted); padding-left: 4px; }
  .msg figcaption b { color: var(--text); font-weight: 700; }
  .msg.pending { display: none; }
  .msg.arrive { animation: msgIn .4s cubic-bezier(.2, .9, .3, 1.2) both; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(10px) scale(.96); } }
  .typing { display: none; gap: 4px; padding: 12px 14px; border-radius: 18px 18px 18px 6px; background: rgba(255, 255, 255, .09); width: max-content; margin-left: 44px; }
  .typing.on { display: flex; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-2px); } }
  .chat-note { margin: 18px 0 0; text-align: center; font-size: 12px; color: var(--muted); }

  /* ---------- Projects (finder + folders) ---------- */
  .projects .win-body { padding: 0; display: flex; flex-direction: column; }
  .finder-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .finder-bar b { color: var(--text); }
  .finder { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 260px; }
  .finder-grid { list-style: none; margin: 0; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 18px 10px; align-content: start; overflow: auto; }
  .proj-btn { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 12px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--text); }
  .proj-btn:hover { background: rgba(255, 255, 255, .05); }
  .proj-btn[aria-pressed="true"] { background: rgba(182, 156, 255, .16); border-color: rgba(182, 156, 255, .4); }
  .proj-label { font-size: 13px; font-weight: 700; line-height: 1.3; text-align: center; }
  .proj-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .proj-status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  /* FinderFolders: React Bits Folder, in CSS. The front panel skews down and papers rise. */
  .folder { position: relative; width: 84px; height: 64px; }
  .folder .back { position: absolute; inset: 6px 0 0; border-radius: 4px 10px 10px 10px; background: color-mix(in srgb, var(--fc) 72%, #000); }
  .folder .back::before { content: ''; position: absolute; left: 0; top: -7px; width: 34px; height: 10px; border-radius: 5px 5px 0 0; background: inherit; }
  .folder .paper { position: absolute; left: 10%; right: 10%; bottom: 8px; height: 70%; border-radius: 6px; background: #E9ECF4; transition: transform .35s cubic-bezier(.2, .9, .3, 1.2); transform: translateY(10%); }
  .folder .paper:nth-child(2) { background: #D6DBE7; left: 14%; right: 14%; }
  .folder .paper:nth-child(3) { background: #fff; left: 18%; right: 18%; }
  .folder .front { position: absolute; inset: 14px 0 0; border-radius: 6px 6px 10px 10px; background: linear-gradient(180deg, color-mix(in srgb, var(--fc) 100%, #fff 18%), var(--fc)); transform-origin: bottom; transition: transform .35s cubic-bezier(.2, .9, .3, 1.2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5); }
  .proj-btn:hover .folder .front, .proj-btn[aria-pressed="true"] .folder .front { transform: skewX(12deg) scaleY(.72); }
  .proj-btn:hover .folder .paper:nth-child(1), .proj-btn[aria-pressed="true"] .folder .paper:nth-child(1) { transform: translate(-14%, -22%) rotate(-12deg); }
  .proj-btn:hover .folder .paper:nth-child(2), .proj-btn[aria-pressed="true"] .folder .paper:nth-child(2) { transform: translate(14%, -20%) rotate(12deg); }
  .proj-btn:hover .folder .paper:nth-child(3), .proj-btn[aria-pressed="true"] .folder .paper:nth-child(3) { transform: translateY(-30%); }
  .finder-info { border-left: 1px solid var(--line); padding: 18px; overflow: auto; background: rgba(0, 0, 0, .14); }
  .proj-info h3 { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
  .proj-info .status-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .proj-info .note { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
  .proj-info p.desc { margin: 10px 0 0; font-size: 14px; color: #D6DCE8; }
  .proj-info .links { margin: 12px 0 0; display: flex; gap: 12px; font-size: 13.5px; font-weight: 700; }
  .projects .proj-card .proj-info { display: none; }
  .finder-more { margin: 0; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }

  /* ---------- Contact (mail) ---------- */
  .contact .win-body { padding: 0; }
  .mail-tools { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .mail-tools .avail { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .mail-tools .avail b { color: var(--text); font-weight: 700; }
  .mail-form { padding: 0 18px; }
  .mail-field { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); min-height: 44px; font-size: 14px; }
  .mail-field label, .mail-lbl { color: var(--muted); font-weight: 600; }
  .mail-field input { background: transparent; border: 0; padding: 10px 0; width: 100%; }
  .mail-field input:focus-visible, .mail-body textarea:focus-visible { outline: none; }
  .mail-field:focus-within, .mail-body:focus-within { box-shadow: inset 0 -2px 0 var(--teal); }
  .mail-to { font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .mail-to span { padding: 2px 10px; border-radius: 99px; background: rgba(182, 156, 255, .18); border: 1px solid rgba(182, 156, 255, .4); }
  .mail-body textarea { display: block; width: 100%; min-height: 150px; resize: vertical; background: transparent; border: 0; padding: 14px 0; line-height: 1.6; }
  .mail-send { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 6px 18px 18px; }
  .mail-send small { color: var(--muted); font-size: 12.5px; }
  .mail-alt { border-top: 1px solid var(--line); padding: 16px 18px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; list-style: none; margin: 0; }
  .mail-alt a, .mail-alt span.na { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); text-decoration: none; color: var(--text); font-size: 14px; font-weight: 700; height: 100%; }
  .mail-alt a:hover { background: rgba(255, 255, 255, .1); color: var(--text); }
  .mail-alt small { font-weight: 500; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .mail-alt small.todo { color: var(--amber); }

  /* ---------- Terminal ---------- */
  .terminal { --glass: rgba(6, 8, 16, .9); --glass-hi: rgba(6, 8, 16, .92); }
  .terminal .win-body { padding: 14px 16px; font: 13px/1.6 var(--mono); color: #D9E2F2; }
  .term-out { white-space: pre-wrap; word-break: break-word; margin: 0; }
  .term-out .c-ok { color: var(--teal); } .term-out .c-dim { color: #8C96AC; } .term-out .c-warn { color: var(--amber); } .term-out .c-lilac { color: var(--lilac); }
  .term-form { display: flex; gap: 8px; align-items: baseline; }
  .term-prompt { color: var(--teal); white-space: nowrap; }
  .term-form input { flex: 1; min-width: 0; background: transparent; border: 0; padding: 0; font: inherit; color: var(--text); caret-color: var(--teal); }
  .term-form input:focus-visible { outline: none; }

  /* ---------- Trash ---------- */
  .trash-list { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
  .trash-list li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); font-size: 14px; transition: transform .45s cubic-bezier(.5, 0, .75, 0), opacity .45s; }
  .trash-list li b { display: block; }
  .trash-list li span { color: var(--muted); font-size: 13px; }
  .trash-list li i { width: 34px; height: 40px; border-radius: 4px 10px 4px 4px; background: linear-gradient(#E9ECF4, #C5CBDA); display: grid; place-items: center; font-style: normal; font-size: 9px; font-weight: 800; color: #4A5470; }
  .trash-list.emptying li { transform: translateY(40px) scale(.6) rotate(8deg); opacity: 0; }
  .trash-done { margin: 0; color: var(--muted); font-size: 14px; }

  /* ---------- notification toast ---------- */
  .toast { position: fixed; z-index: 6000; top: calc(var(--menubar) + 12px); right: 12px; width: 340px; max-width: calc(100vw - 24px); display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 12px 14px; border-radius: 16px; text-align: left; border: 0;
    background: rgba(22, 28, 50, .85); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%);
    box-shadow: inset 0 0 0 1px var(--line-hi), 0 20px 50px -10px rgba(0, 0, 0, .7); color: var(--text); transform: translateX(120%); transition: transform .5s cubic-bezier(.2, .9, .3, 1.1); }
  .toast.on { transform: none; }
  .toast[hidden] { display: none; }
  .toast .ic { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(140deg, #5EF0B0, #2FB6E8); display: grid; place-items: center; }
  .toast .ic svg { width: 20px; height: 20px; }
  .toast b { font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
  .toast b small { color: var(--muted); font-weight: 600; }
  .toast span { font-size: 13.5px; color: #DCE2EE; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ---------- dock ---------- */
  .dock { position: fixed; z-index: 4000; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 6px; padding: 8px 10px; border-radius: 22px; height: 70px;
    background: rgba(18, 23, 42, .5); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14), inset 0 1px 0 rgba(255, 255, 255, .22), 0 18px 40px -12px rgba(0, 0, 0, .7); }
  .dock-list { display: flex; align-items: flex-end; gap: 6px; list-style: none; margin: 0; padding: 0; }
  .dock-sep { width: 1px; align-self: stretch; margin: 6px 4px; background: var(--line-hi); }
  .dock-item { position: relative; display: block; width: var(--s, 52px); height: var(--s, 52px); padding: 0; border: 0; background: none; border-radius: 14px; text-decoration: none; color: var(--text); flex: none; }
  .dock-item .app { position: absolute; inset: 0; border-radius: 23%; display: grid; place-items: center; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -2px 6px rgba(0, 0, 0, .2), 0 6px 14px -4px rgba(0, 0, 0, .6); }
  .dock-item .app svg { width: 56%; height: 56%; }
  .dock-item .app .mono-r { font-weight: 800; font-size: calc(var(--s, 52px) * .5); color: var(--ink); line-height: 1; }
  .dock-item .tip { position: absolute; left: 50%; bottom: calc(100% + 12px); transform: translateX(-50%) translateY(4px); padding: 4px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 700; white-space: nowrap; background: rgba(20, 25, 44, .92); border: 1px solid var(--line-hi); opacity: 0; pointer-events: none; transition: opacity .12s, transform .12s; }
  .dock-item:hover .tip, .dock-item:focus-visible .tip { opacity: 1; transform: translateX(-50%); }
  .dock-item::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--text); opacity: 0; }
  .dock-item[data-running="true"]::after { opacity: .85; }
  .dock-item.bounce .app { animation: dockBounce .7s cubic-bezier(.3, 0, .3, 1); }
  @keyframes dockBounce { 30% { transform: translateY(-16px); } 55% { transform: none; } 75% { transform: translateY(-6px); } }
  .dock-item .lbl { display: none; }

  /* app icon colours (shared by dock, phone grid and settings tabs) */
  .ic-welcome { background: linear-gradient(140deg, var(--teal), var(--lilac)); }
  .ic-about { background: linear-gradient(150deg, #8AA2FF, #4B5BDA); }
  .ic-stack { background: linear-gradient(150deg, #C7CEDC, #737D94); }
  .ic-career { background: linear-gradient(150deg, #FFB86B, #F0672F); }
  .ic-team { background: linear-gradient(150deg, #6FF2B4, #24B26E); }
  .ic-projects { background: linear-gradient(150deg, #7CD3FF, #2F86E0); }
  .ic-contact { background: linear-gradient(150deg, #8FC5FF, #3A6FF0); }
  .ic-terminal { background: linear-gradient(150deg, #2A3146, #0B0E18); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2) !important; }
  .ic-cv { background: linear-gradient(150deg, #FFFFFF, #D4D9E6); }
  .ic-trash { background: linear-gradient(150deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, .08)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25) !important; }

  /* =========================================================
     PHONE: a home screen; apps open as full-screen sheets
     ========================================================= */
  .mode-phone .menubar { height: 44px; padding: 0 14px; background: rgba(6, 9, 18, .62); border-color: transparent; font-size: 13px; }
  .mode-phone .mb-logo, .mode-phone .mb-app { display: none; }
  .mode-phone .mb-status b { display: none; }
  .mode-phone .mb-clock { order: -1; font-size: 15px; font-weight: 800; padding: 0; }
  .mode-phone .desk-icons, .mode-phone .snap-preview, .mode-phone .toast, .mode-phone .win-resize, .mode-phone .l-min, .mode-phone .l-max { display: none; }
  .mode-phone main { padding: 56px 16px 0; }
  .mode-phone .welcome { position: relative; z-index: 1; display: flex; transform: none !important; width: auto !important; height: auto !important; max-width: none; min-width: 0; border-radius: 26px; }
  .mode-phone .welcome .win-bar { display: none; }
  .mode-phone .welcome .win-body { padding: 24px 22px 0; overflow: visible; }
  .mode-phone .wel-top { margin-bottom: 16px; }
  .mode-phone .wel-ctas .btn { flex: 1 1 140px; }
  .mode-phone .wel-foot { margin: 22px -22px 0; padding: 12px 22px; border-radius: 0 0 26px 26px; }
  .mode-phone .dock { position: relative; z-index: 1; left: auto; bottom: auto; transform: none; height: auto; display: block; margin: 22px 16px 0; padding: 18px 10px 14px; border-radius: 28px; background: rgba(18, 23, 42, .42); }
  .mode-phone .dock-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 6px; justify-items: center; }
  .mode-phone .dock-sep { display: none; }
  .mode-phone .dock-item { --s: 60px; width: auto; height: auto; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .mode-phone .dock-item .app { position: relative; inset: auto; width: 60px; height: 60px; }
  .mode-phone .dock-item .tip { display: none; }
  .mode-phone .dock-item .lbl { display: block; font-size: 12px; font-weight: 700; color: var(--text); text-shadow: 0 1px 4px rgba(0, 0, 0, .8); }

  .mode-phone .site-footer { position: relative; z-index: 1; padding: 22px 16px 30px; text-align: center; }
  .mode-phone .win:not(.welcome) {
    display: flex; position: fixed; inset: 0; top: 0; z-index: 7000; width: auto !important; height: auto !important; max-width: none; min-width: 0;
    border-radius: 0; transform: translateY(102%) !important; visibility: hidden; transition: transform .42s cubic-bezier(.2, .85, .25, 1), visibility 0s .42s;
    background: rgba(12, 16, 31, .96); padding-top: env(safe-area-inset-top);
  }
  .mode-phone .win:not(.welcome).is-open { transform: translateY(var(--drag, 0px)) !important; visibility: visible; transition: transform .42s cubic-bezier(.2, .85, .25, 1), visibility 0s; }
  .mode-phone .win:not(.welcome).dragging { transition: none; }
  .mode-phone .win::before { display: none; }
  .mode-phone .win-bar { height: 56px; border-radius: 0; cursor: default; justify-content: flex-start; }
  .mode-phone .win-bar::before { content: ''; position: absolute; top: 6px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: rgba(255, 255, 255, .25); }
  .mode-phone .win-title { justify-content: flex-start; font-size: 17px; padding: 0; order: -1; }
  .mode-phone .lights { order: 2; }
  .mode-phone .l-close { width: auto; height: 34px; padding: 0 14px; border-radius: 99px; background: rgba(255, 255, 255, .1) !important; box-shadow: none; font-size: 14px; font-weight: 800; color: var(--text); }
  .mode-phone .l-close svg { display: none; }
  .mode-phone .l-close::before { content: 'Done'; }
  .mode-phone .win-body { padding: 18px 16px 40px; }
  .mode-phone .about-grid, .mode-phone .settings, .mode-phone .finder { grid-template-columns: 1fr; }
  .mode-phone .set-side, .mode-phone .finder-info, .mode-phone .finder-grid { display: none; }
  .mode-phone .stack .win-body, .mode-phone .projects .win-body, .mode-phone .contact .win-body { padding: 0 0 40px; }
  .mode-phone .set-main { padding: 18px 16px; }

  /* =========================================================
     LIST: the same markup as a plain scrolling page
     ========================================================= */
  .mode-list .menubar { position: sticky; height: 52px; padding: 0 max(16px, calc(50% - 480px)); background: rgba(8, 11, 22, .85); }
  .mode-list .mb-app { display: none; }
  .mode-list .mb-nav { display: flex; }
  .mode-list .mb-clock { display: none; }
  .mode-list .desk-icons, .mode-list .dock, .mode-list .snap-preview, .mode-list .toast, .mode-list .win-resize, .mode-list .lights,
  .mode-list .terminal, .mode-list .trash { display: none !important; }
  .mode-list main { position: relative; z-index: 1; max-width: 992px; margin: 0 auto; padding: 24px 16px 20px; display: grid; gap: 22px; }
  .mode-list .win { position: relative; display: flex; transform: none !important; width: auto !important; height: auto !important; max-width: none; min-width: 0; z-index: 1 !important; scroll-margin-top: 64px; }

  /* shared by phone and list: every stack group and every project card is shown */

  .mode-phone .set-panel + .set-panel, .mode-list .set-panel + .set-panel { margin-top: 26px; }

  /* =====================================================================
     ViewMode (custom): desktop, phone home screen, or a plain list.
     The same markup serves all three; CSS does the rest.
     ===================================================================== */
  let mode = 'desktop';
  let listChosen = false;
  try { listChosen = localStorage.getItem('ralphos-view') === 'list'; } catch (e) { /* storage blocked */ }
  function computeMode() { return listChosen ? 'list' : (phoneQuery.matches ? 'phone' : 'desktop'); }
  function applyMode() {
    const next = computeMode();
    const prev = mode;
    mode = next;
    document.body.classList.remove('mode-desktop', 'mode-phone', 'mode-list');
    document.body.classList.add('mode-' + mode);
    $$('[data-view]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.view === 'list') === listChosen)));
    $('[data-view="os"]').textContent = phoneQuery.matches ? CONTENT.views.home : CONTENT.views.os;
    $('[data-skip-list]').textContent = listChosen ? 'Switch to desktop view' : 'Switch to list view';
    // stack panels: tabs on the desktop, every group in the other views
    $$('#stack .set-panel').forEach((p, i) => { p.hidden = mode === 'desktop' ? $('#tab-' + i).getAttribute('aria-selected') !== 'true' : false; });
    WindowManager.onMode(prev, mode);
    AuroraWallpaper.setActive(mode !== 'list');
    TimelineDraw.update();
  }

  /* =====================================================================
     WindowManager (custom). Holds every window's state and geometry.
     In React: a reducer ({ windows, order, focused }) plus a pointer hook.
     ===================================================================== */
  const WindowManager = (() => {
    const wins = new Map();
    let z = 20;
    let focused = null;
    // preferred size and where the window sits in the free area (0 = left/top, 1 = right/bottom)
    const PREF = {
      welcome: { w: 620, h: 'auto', ax: .5, ay: .42 },
      about: { w: 660, h: 540, ax: .1, ay: .15 },
      stack: { w: 760, h: 560, ax: .55, ay: .25 },
      career: { w: 600, h: 620, ax: .9, ay: .1 },
      team: { w: 430, h: 580, ax: .97, ay: .3 },
      projects: { w: 740, h: 520, ax: .35, ay: .6 },
      contact: { w: 580, h: 600, ax: .7, ay: .55 },
      terminal: { w: 620, h: 400, ax: .2, ay: .75 },
      trash: { w: 440, h: 'auto', ax: .85, ay: .8 }
    };
    const area = () => {
      const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--menubar')) + 10;
      const bottom = innerHeight - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dock-h')) - 6;
      return { left: 10, top, right: innerWidth - 10, bottom, w: innerWidth - 20, h: bottom - top };
    };
    function place(w) {
      const p = PREF[w.id], A = area();
      w.w = Math.min(p.w, A.w - (w.id === 'welcome' ? 32 : 120));
      const h = p.h === 'auto' ? measureAuto(w) : Math.min(p.h, A.h);
      w.h = p.h === 'auto' ? 'auto' : h;
      w.x = Math.round(A.left + (A.w - w.w) * p.ax);
      w.y = Math.round(A.top + Math.max(0, A.h - h) * p.ay);
      w.placed = true;
    }
    function measureAuto(w) { w.el.style.width = w.w + 'px'; const prevDisplay = w.el.style.display; w.el.style.visibility = 'hidden'; w.el.classList.add('is-open'); const h = w.el.offsetHeight; w.el.classList.toggle('is-open', w.state === 'open' || w.state === 'min'); w.el.style.visibility = ''; w.el.style.display = prevDisplay; return h; }
    function apply(w) {
      if (mode !== 'desktop') return;
      w.el.style.transform = `translate3d(${Math.round(w.x)}px, ${Math.round(w.y)}px, 0)`;
      w.el.style.width = w.w + 'px';
      w.el.style.height = w.h === 'auto' ? '' : w.h + 'px';
    }
    function clamp(w) {
      const A = area(), wid = w.w, hgt = w.h === 'auto' ? w.el.offsetHeight : w.h;
      w.x = Math.min(Math.max(w.x, A.left - wid + 140), A.right - 140);
      w.y = Math.min(Math.max(w.y, A.top - 10), A.bottom - 44);
      return hgt;
    }
    const dockIcon = id => $(`.dock [data-open="${id}"]`);
    const iconRect = id => { const i = dockIcon(id); return i ? i.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight - 40, width: 0, height: 0 }; };
    const animOK = () => !reduceMotion.matches && 'animate' in Element.prototype;

    /* OpenFromIcon (custom, WAAPI): the window grows out of its dock icon */
    function animateOpen(w, from) {
      if (!animOK()) return;
      const r = from ? from.getBoundingClientRect() : iconRect(w.id);
      const W = w.el.offsetWidth, H = w.el.offsetHeight, s = Math.max(.06, Math.min(r.width / W, .2) || .08);
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      w.el.animate([
        { transform: `translate3d(${cx - W * s / 2}px, ${cy - H * s / 2}px, 0) scale(${s})`, opacity: 0 },
        { opacity: 1, offset: .35 },
        { transform: `translate3d(${w.x}px, ${w.y}px, 0) scale(1)`, opacity: 1 }
      ], { duration: 420, easing: 'cubic-bezier(.2, .9, .25, 1.06)' });
    }
    /* Genie (custom, WAAPI): squeezed and pulled into the dock icon */
    function animateToIcon(w, kind) {
      if (!animOK()) return Promise.resolve();
      const r = iconRect(w.id), W = w.el.offsetWidth, H = w.el.offsetHeight;
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const frames = kind === 'min' ? [
        { transform: `translate3d(${w.x}px, ${w.y}px, 0) scale(1, 1)`, opacity: 1 },
        { transform: `translate3d(${(w.x + cx - W * .3 / 2) / 2}px, ${(w.y + cy) / 2 - H * .2}px, 0) scale(.3, .6)`, opacity: .9, offset: .5 },
        { transform: `translate3d(${cx - W * .04 / 2}px, ${cy - H * .04 / 2}px, 0) scale(.04, .04)`, opacity: 0 }
      ] : [
        { transform: `translate3d(${w.x}px, ${w.y}px, 0) scale(1)`, opacity: 1 },
        { transform: `translate3d(${w.x + W * .04}px, ${w.y + H * .04}px, 0) scale(.92)`, opacity: 0 }
      ];
      return w.el.animate(frames, { duration: kind === 'min' ? 480 : 180, easing: kind === 'min' ? 'cubic-bezier(.5, 0, .7, .4)' : 'ease-in' }).finished.catch(() => {});
    }

    function focus(id) {
      const w = wins.get(id); if (!w) return;
      if (focused !== id) w.el.style.zIndex = ++z;
      focused = id;
      wins.forEach(o => o.el.classList.toggle('is-focused', o.id === id));
      $('.mb-app').textContent = app(id) ? app(id).title : '';
      GlassRim.target(w.el);
    }
    function topOpen() {
      let best = null;
      wins.forEach(w => { if (w.state === 'open' && (!best || +w.el.style.zIndex > +best.el.style.zIndex)) best = w; });
      return best;
    }
    function updateDock() {
      $$('.dock button.dock-item').forEach(b => {
        const w = wins.get(b.dataset.open); if (!w) return;
        const running = w.state !== 'closed' && mode !== 'list';
        b.dataset.running = String(running);
        const st = b.querySelector('.state'); const label = b.querySelector('.lbl').textContent;
        st.textContent = label + (w.state === 'min' ? ' (minimised)' : running ? ' (open)' : '');
      });
    }
    function setInertForSheet(on, w) {
      const outside = [$('.menubar'), $('.dock'), $('.site-footer'), ...$$('.win')].filter(el => el && el !== w.el);
      outside.forEach(el => { on ? el.setAttribute('inert', '') : el.removeAttribute('inert'); });
      document.body.classList.toggle('sheet-open', on);
    }

    function open(id, opener) {
      const w = wins.get(id); if (!w) return;
      if (mode === 'list') {
        if (w.el.offsetParent) { w.el.scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth' }); focusHeading(w); }
        return;
      }
      if (opener) w.opener = opener;
      if (w.state === 'open') {
        if (mode === 'desktop') { focus(id); focusHeading(w); }
        return;
      }
      const wasMin = w.state === 'min';
      w.state = 'open';
      w.el.classList.add('is-open'); w.el.classList.remove('is-min');
      if (mode === 'desktop') {
        if (!w.placed) place(w);
        apply(w); focus(id);
        animateOpen(w, wasMin ? null : opener);
      } else if (mode === 'phone' && id !== 'welcome') {
        w.el.style.setProperty('--drag', '0px');
        setInertForSheet(true, w);
      }
      const btn = dockIcon(id);
      if (btn && !wasMin && animOK() && mode === 'desktop') { btn.classList.remove('bounce'); void btn.offsetWidth; btn.classList.add('bounce'); }
      updateDock(); focusHeading(w);
      document.dispatchEvent(new CustomEvent('win:open', { detail: id }));
    }
    function focusHeading(w) {
      const h = w.id === 'welcome' ? $('#welcome-title') : w.el.querySelector('.win-title');
      requestAnimationFrame(() => h && h.focus({ preventScroll: mode !== 'list' }));
    }
    async function close(id) {
      const w = wins.get(id); if (!w || w.state === 'closed') return;
      if (mode === 'phone' && id === 'welcome') return;
      if (mode === 'desktop') await animateToIcon(w, 'close');
      w.state = 'closed'; w.el.classList.remove('is-open', 'is-focused', 'is-min');
      if (mode === 'phone') setInertForSheet(false, w);
      afterHide(w);
    }
    async function minimise(id) {
      const w = wins.get(id); if (!w || w.state !== 'open') return;

        const groups = CONTENT.stack.groups.filter(g => !q || g.name.toLowerCase().startsWith(q));
        if (!groups.length) return print(esc('stack: no such group. Groups: ' + CONTENT.stack.groups.map(g => g.name).join(', ')));
        print(groups.map(g => `<span class="c-lilac">${esc(g.name)}</span>\n` + g.items.map(([n, l]) => '  ' + esc(pad(n, 32)) + `<span class="${l === 'strong' ? 'c-ok' : 'c-dim'}">${'■'.repeat({ strong: 3, medium: 2, low: 1 }[l])}${'□'.repeat({ strong: 0, medium: 1, low: 2 }[l])} ${esc(l)}</span>`).join('\n')).join('\n'));
      },
      career: () => print(CONTENT.career.jobs.map(j => `<span class="c-dim">${esc(j.dates)}</span>  <span class="c-ok">${esc(j.company)}</span>  ${esc(j.roles.join(' → '))}`).join('\n')),
      contact: () => print(esc(`email     ${P.email}\ngithub    ${P.github}\n`) + '<span class="c-warn">linkedin  TODO: Rafał to provide URL\ncalendly  TODO: Rafał to provide URL</span>'),
      cv: () => { print('<span class="c-ok">downloading ' + esc(P.cvFile.slice(1)) + '…</span>'); downloadCV(); },
      clear: () => { out.innerHTML = ''; },
      exit: () => WindowManager.close('terminal'),
      date: () => print(esc(new Date().toString())),
      echo: a => print(esc(a.join(' '))),
      sudo: a => {
        if (a.join(' ').toLowerCase() === 'hire ralph') { sudo = 'hire'; prompt.textContent = T.sudoPrompt; input.type = 'password'; return; }
        print(esc('recruiter is not in the sudoers file. This incident will be reported to Ralph. (He will just smile.)'), 'c-warn');
      },
      ralph: () => print(esc('That is me. At work, "Rafał" turns into "Ralph" within a week.'))
    };
    function run(line) {
      if (sudo) {
        sudo = null; prompt.textContent = T.prompt; input.type = 'text';
        print(esc(T.sudoPrompt) + ' ********');
        print('<span class="c-ok">Access granted.</span> Opening a draft in Contact…');
        $('#mail-subject').value = "Let's talk: a frontend role";
        setTimeout(() => WindowManager.open('contact'), 500);
        return;
      }
      print(`<span class="c-ok">${esc(T.prompt)}</span> ${esc(line)}`);
      const [cmd, ...args] = line.trim().split(/\s+/);
      if (!cmd) return;
      history.push(line); hi = history.length;
      (CMDS[cmd.toLowerCase()] || (() => print(esc(T.notFound(cmd)), 'c-warn')))(args);
    }
    $('#terminal .term-form').addEventListener('submit', e => { e.preventDefault(); const v = input.value; input.value = ''; run(v); });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' && history.length) { e.preventDefault(); hi = Math.max(0, hi - 1); input.value = history[hi]; }
      if (e.key === 'ArrowDown' && history.length) { e.preventDefault(); hi = Math.min(history.length, hi + 1); input.value = history[hi] || ''; }
      if (e.key === 'Tab' && input.value) {
        const parts = input.value.split(' ');
        const pool = parts.length === 1 ? Object.keys(CMDS) : parts[0] === 'open' ? appIds : [];
        const m = pool.filter(c => c.startsWith(parts[parts.length - 1]));
        if (m.length === 1) { e.preventDefault(); parts[parts.length - 1] = m[0]; input.value = parts.join(' ') + (parts.length === 1 ? ' ' : ''); }
      }
    });
    $('#terminal .win-body').addEventListener('click', () => { if (!getSelection().toString()) input.focus(); });
    print(`<span class="c-dim">${esc(T.motd)}</span>`);
    document.addEventListener('win:open', e => { if (e.detail === 'terminal') setTimeout(() => input.focus(), 30); });
  }

  /* Trash (custom easter egg) */
  function Trash() {
    const btn = $('#trash [data-empty]');
    btn.addEventListener('click', () => {
      const list = $('#trash .trash-list'); list.classList.add('emptying');
      setTimeout(() => { list.outerHTML = `<p class="trash-done" role="status">${esc(CONTENT.trash.done)}</p>`; btn.remove(); $('#trash .win-title small').textContent = '0 items'; }, reduceMotion.matches ? 0 : 480);
    });
  }

  /* NotificationToast (custom): one team quote slides in once, on the desktop */
  function NotificationToast() {
    const t = $('.toast'); const q = CONTENT.team.quotes[0];
    t.innerHTML = `<span class="ic" aria-hidden="true">${GLYPH.team}</span><span><b>${esc(CONTENT.team.toastApp)} <small>${esc(q.name)}</small></b><span>${esc(q.text[0])}</span></span>`;
    t.setAttribute('aria-label', `${CONTENT.team.toastApp}: ${q.name}: ${q.text[0]} Open Team.`);
    let shown = false;
    document.addEventListener('win:open', e => { if (e.detail === 'team') hide(); });
    function hide() { t.classList.remove('on'); setTimeout(() => { t.hidden = true; }, 500); }
    setTimeout(() => {
      if (shown || mode !== 'desktop' || WindowManager.get('team').state !== 'closed') return;
      shown = true; t.hidden = false; requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('on')));
      setTimeout(hide, 9000);
    }, 4500);
    t.addEventListener('click', () => { hide(); WindowManager.open('team', $('.dock [data-open="team"]')); });
  }

  /* MenuClock (custom): the visitor's own time, like any menu bar */
  function MenuClock() {
    const el = $('.mb-clock');
    const tick = () => { const d = new Date(); el.dateTime = d.toISOString(); el.textContent = d.toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' }).replace(',', ''); };
    tick(); setInterval(tick, 15000);
  }

  function ConsoleHello() {
    console.log('%c RalphOS %c ' + CONTENT.console, 'background:linear-gradient(90deg,#3EE6C8,#B69CFF);color:#0A0718;font:800 12px Manrope,sans-serif;padding:3px 8px;border-radius:6px', 'font:600 13px Manrope,sans-serif;color:#B69CFF');
  }

  /* =====================================================================
     Boot
     ===================================================================== */
  renderShell(); renderWelcome(); renderAbout(); renderStack(); renderCareer(); renderTeam(); renderProjects(); renderContact(); renderTerminal(); renderTrash();
  WindowManager.init();
  applyMode();
  phoneQuery.addEventListener('change', applyMode);
  $$('[data-view]').forEach(b => b.addEventListener('click', () => {
    listChosen = b.dataset.view === 'list';
    try { localStorage.setItem('ralphos-view', listChosen ? 'list' : 'os'); } catch (e) { /* storage blocked */ }
    applyMode(); scrollTo(0, 0); b.focus();
  }));
  $('[data-skip-list]').addEventListener('click', e => { e.preventDefault(); $(`[data-view="${listChosen ? 'os' : 'list'}"]`).click(); $('#welcome-title').focus(); });
  $('[data-skip]').addEventListener('click', e => { e.preventDefault(); $('#welcome-title').focus(); });
  DockMagnify(); SettingsTabs(); TimelineDraw.init(); MessagesTyping(); FinderFolders(); MailComposer(); Terminal(); Trash(); NotificationToast(); MenuClock(); ConsoleHello();
  // the wallpaper waits for first paint, so the Welcome text is always first
  (window.requestIdleCallback || (f => setTimeout(f, 200)))(() => AuroraWallpaper.init(), { timeout: 800 });
  reduceMotion.addEventListener('change', () => { AuroraWallpaper.setActive(mode !== 'list'); TimelineDraw.update(); });
</script>
</body>
