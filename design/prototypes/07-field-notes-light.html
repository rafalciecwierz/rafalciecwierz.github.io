<!doctype html>
<!--
  Prototype 07 — Field Notes (`field-notes`), LIGHT variant: "Plotter Sheet".
  Direction brief: docs/design/DIRECTIONS.md, section 07.

  Concept: the CV as one long sheet from a pen plotter. The page is a technical drawing on warm
  paper: a drawing frame with zone marks, figures with captions, a title block in the footer, and
  Ralph's handwritten notes in the margins. Nothing floats or glows; everything is drawn by a pen,
  line by line, and the drawings mean something:
  - Hero: a contour map whose terrain is the name itself. The plotter draws the contour lines
    around the real HTML name, ring by ring; afterwards the pointer raises the terrain as it moves
    and new contour rings grow around its path, then settle (so the visitor can draw in it).
  - Stack: hatching, as on engineering drawings, where the hatch pattern names the material:
    cross-hatch for strong, single hatch for medium, stipple for low.
  - Career: a time plot drawn in one stroke, stepping up to each new job, with promotions circled.
  - Projects: plates, each with a harmonograph drawn from a seed made of the project name.
  Easter egg: type "plot" anywhere and the whole sheet is replotted.
  It shares only the style (creative coding, generative drawing, kinetic line) with the dark
  variant, "Long Exposure": no canvas flow field, no light, no orbits, no seed control, no Syne.

  Effects (each is a named function in the script below):
  - ContourPlot ....... custom canvas 2D: a height field from the name's glyphs (blurred mask plus
                        seeded noise), marching squares into contour lines, chained into polylines
                        and plotted progressively with a moving pen nib
  - TerrainPress ...... custom: the pointer raises hills in the height field; contours redraw live
  - PlotReveal ........ custom SVG line drawing with a pen nib (GSAP DrawSVG plugin in React)
  - HatchSwatch ....... custom SVG hatching per experience level
  - TimePlot .......... custom SVG: the career as one stroke over a time axis
  - Harmonograph ...... custom SVG: a damped two-pendulum curve per project
  - Handwriting ....... custom: margin notes are written in left to right (CSS clip-path)
  - Replot ............ custom easter egg: typing "plot" replots the sheet
  - NavMenu (mobile, focus trapped), ConsoleHello: custom

  Libraries in this file: none.
  Fonts: Space Grotesk (display and text), IBM Plex Mono (drawing labels), Kalam (handwritten
  notes), Google Fonts, latin-ext. None is used by any other prototype.
  React build would need: nothing beyond React (GSAP DrawSVG for the line drawing is optional).

  Mobile: a coarser contour grid and fewer levels; the time plot is laid out for the real width.
  Reduced motion: everything is already plotted when the page opens, no nib, no pointer presses,
  no handwriting animation, no smooth scroll.
  No canvas: the hero shows a static SVG ring pattern instead; every other drawing is SVG.

  Content: all copy lives in the CONTENT object at the top of the script. Additions beyond
  brief section 5 are marked `NEW CONTENT` there.
-->

<style>
  :root {
    --paper: #FAF8F2;        /* plotter paper */
    --paper-2: #F2EFE6;
    --ink: #1A1C22;          /* graphite-black text */

  body { margin: 0; font: 400 17px/1.6 var(--display); background: var(--paper); overflow-x: hidden; }
  a { color: var(--blue); text-underline-offset: .18em; text-decoration-thickness: 1px; }
  a:hover { text-decoration-thickness: 2px; }

  ::selection { background: var(--blue); color: var(--paper); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .skip { position: fixed; left: 12px; top: -60px; z-index: 100; background: var(--blue); color: var(--paper); padding: 10px 16px; font: 500 15px var(--mono); text-decoration: none; }
  .skip:focus { top: 12px; }
  .todo { color: var(--todo); font-weight: 600; }
  .mono { font-family: var(--mono); }

  /* ---------- the drawing frame (fixed, decorative) ---------- */
  .frame { position: fixed; inset: 12px; z-index: 30; pointer-events: none; border: 1px solid var(--ink); }
  .frame .zones { position: absolute; display: flex; justify-content: space-around; font: 500 10px/1 var(--mono); color: var(--pencil); }
  .frame .zones.h { left: 0; right: 0; height: 12px; align-items: center; }
  .frame .zones.zt { top: -12px; } .frame .zones.zb { bottom: -12px; }
  .frame .zones.v { top: 0; bottom: 0; width: 12px; flex-direction: column; align-items: center; }
  .frame .zones.left { left: -12px; } .frame .zones.right { right: -12px; }
  .frame .tick { position: absolute; background: var(--ink); }
  .frame .tick.t { top: -12px; left: calc(50% - .5px); width: 1px; height: 12px; }
  .frame .tick.b { bottom: -12px; left: calc(50% - .5px); width: 1px; height: 12px; }
  .frame .tick.l { left: -12px; top: calc(50% - .5px); height: 1px; width: 12px; }
  .frame .tick.r { right: -12px; top: calc(50% - .5px); height: 1px; width: 12px; }
  @media (max-width: 899px) { .frame { inset: 6px; border-color: var(--rule); } .frame .zones, .frame .tick { display: none; } }

  /* ---------- header ---------- */
  .top { position: fixed; z-index: 25; top: 12px; left: 12px; right: 12px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px calc(var(--gutter) - 12px); background: rgba(250, 248, 242, .94); border-bottom: 1px solid var(--rule); }
  .brand { font: 500 13px/1.2 var(--mono); color: var(--ink); text-decoration: none; letter-spacing: .04em; text-transform: uppercase; display: flex; gap: 10px; align-items: center; }
  .brand b { font: 700 18px/1 var(--display); letter-spacing: -.02em; text-transform: none; border: 1.5px solid var(--ink); padding: 4px 6px; }
  .nav ul { list-style: none; display: flex; gap: clamp(14px, 2.4vw, 30px); margin: 0; padding: 0; }
  .nav a { font: 500 13px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink); text-decoration: none; padding: 8px 0; display: inline-flex; gap: 6px; }
  .nav a span { color: var(--pencil); }
  .nav a:hover, .nav a[aria-current="true"] { color: var(--blue); text-decoration: underline; text-underline-offset: 6px; }
  .menu-btn { display: none; }
  @media (max-width: 820px) {
    .top { top: 6px; left: 6px; right: 6px; padding: 10px 14px; }
    .menu-btn { display: inline-flex; font: 500 13px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); padding: 9px 14px; cursor: pointer; }
    .nav { position: fixed; inset: 0; background: var(--paper); display: none; flex-direction: column; justify-content: center; padding: 32px 28px; }
    .nav.open { display: flex; }
    .nav ul { flex-direction: column; gap: 4px; }

  }
  @media (min-width: 821px) { .nav .close { display: none; } }

  /* ---------- shared ---------- */
  .wrap { width: min(var(--max), 100% - 2 * var(--gutter)); margin-inline: auto; position: relative; }
  section { position: relative; padding: clamp(72px, 10vw, 140px) 0; scroll-margin-top: 50px; }
  .fig-head { display: grid; gap: 14px; margin-bottom: clamp(32px, 5vw, 56px); }
  .fig-no { font: 500 12.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--pencil); display: flex; align-items: center; gap: 12px; }
  /* a dimension line: |<———— label ————>| */
  .dim { position: relative; height: 18px; color: var(--pencil); font: 500 11.5px/18px var(--mono); text-align: center; letter-spacing: .04em; }
  .dim::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--graphite); }
  .dim::after { content: ''; position: absolute; left: 0; right: 0; top: 3px; bottom: 3px; border-left: 1px solid var(--graphite); border-right: 1px solid var(--graphite); }
  .dim span { position: relative; z-index: 1; background: var(--paper); padding: 0 10px; }
  .dim i { position: absolute; top: 50%; width: 7px; height: 7px; border-top: 1px solid var(--graphite); border-left: 1px solid var(--graphite); margin-top: -3.5px; }
  .dim i.l { left: 1px; transform: rotate(-45deg); } .dim i.r { right: 1px; transform: rotate(135deg); }
  h2 { font: 700 clamp(38px, 6.4vw, 84px)/.98 var(--display); letter-spacing: -.04em; margin: 0; }
  .caption { font: 400 15px/1.5 var(--display); color: var(--graphite); max-width: 60ch; margin: 0; }
  .caption b { font: 500 12.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); margin-right: 8px; }
  .note { font: 400 20px/1.25 var(--hand); color: var(--graphite); display: inline-block; }
  .note.blue { color: var(--blue); }
  .js .note.write { clip-path: inset(0 100% 0 0); transition: clip-path 1.1s steps(18, end); }
  .js .note.write.in { clip-path: inset(0 0 0 0); }
  .pen { fill: none; stroke: var(--blue); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .pen.graphite { stroke: var(--graphite); }
  .pen.thin { stroke-width: .8; }
  .nib { position: absolute; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; border: 1.5px solid var(--blue); background: rgba(27, 61, 148, .18); pointer-events: none; z-index: 3; opacity: 0; transition: opacity .2s; }
  .nib.on { opacity: 1; }
  .nib::after { content: ''; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px; border-radius: 50%; background: var(--blue); }

  /* ---------- hero ---------- */
  .hero { min-height: 100svh; padding: 92px 0 48px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  #terrain { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; touch-action: pan-y; }
  .no-canvas #terrain { display: none; }
  .terrain-fallback { display: none; position: absolute; inset: 0; z-index: 0; }
  .no-canvas .terrain-fallback { display: block; }
  .hero .wrap { z-index: 1; pointer-events: none; }
  .hero .wrap a, .hero .wrap button { pointer-events: auto; }
  .sheet-meta { font: 500 12px/1.6 var(--mono); color: var(--pencil); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 clamp(18px, 3vw, 34px); display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .sheet-meta span:first-child { color: var(--ink); }
  .name { font: 700 clamp(46px, 13vw, 168px)/.9 var(--display); letter-spacing: -.055em; margin: 0; color: var(--ink);
    text-shadow: 0 0 3px var(--paper), 0 0 6px var(--paper), 0 0 10px var(--paper), 0 0 14px var(--paper); }
  .name .trace { display: block; width: fit-content; }
  .name .last { color: var(--blue); }
  .hero-foot { margin-top: clamp(24px, 4vw, 44px); display: grid; gap: 22px; }
  .role { margin: 0; font: 600 clamp(22px, 2.4vw, 30px)/1.2 var(--display); letter-spacing: -.02em; background: var(--paper); width: fit-content; padding-right: 8px; }
  .tagline { margin: 6px 0 0; font: 400 15px/1.5 var(--mono); color: var(--graphite); background: var(--paper); width: fit-content; padding-right: 8px; }
  .ctas { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 12px 20px; font: 500 15px/1 var(--mono); letter-spacing: .02em; text-decoration: none; cursor: pointer; border: 1.5px solid var(--blue); transition: background-color .15s, color .15s, box-shadow .15s; }
  .btn-primary { background: var(--blue); color: var(--paper); box-shadow: 4px 4px 0 var(--paper), 4px 4px 0 1.5px var(--blue); }
  .btn-primary:hover { background: #142E70; color: var(--paper); }
  .btn-ghost { background: var(--paper); color: var(--blue); }
  .btn-ghost:hover { background: var(--paper-2); }
  .btn svg { width: 18px; height: 18px; }
  .hero-note { position: absolute; right: 0; bottom: -10px; transform: rotate(-3deg); text-align: right; max-width: 260px; background: var(--paper); padding: 2px 6px; }
  @media (min-width: 900px) { .hero-foot { grid-template-columns: auto 1fr; align-items: end; } .hero-foot .ctas { justify-self: start; } }
  @media (max-width: 899px) { .hero-note { display: none; } }

  /* ---------- about ---------- */
  .about { display: grid; gap: clamp(28px, 5vw, 70px); }
  .about-text p { margin: 0 0 1em; font-size: clamp(18px, 1.8vw, 22px); line-height: 1.55; max-width: 36em; }
  .about-text p:first-child { font-size: clamp(21px, 2.3vw, 28px); line-height: 1.4; letter-spacing: -.01em; }
  .margin { display: grid; gap: 26px; align-content: start; }
  .margin .item { display: grid; gap: 2px; border-left: 1.5px solid var(--blue); padding-left: 14px; }
  .margin .item .note { font-size: 22px; }
  .margin .item small { font: 500 12px var(--mono); color: var(--pencil); text-transform: uppercase; letter-spacing: .06em; }
  @media (min-width: 900px) { .about { grid-template-columns: 1fr 300px; } .margin { padding-top: 10px; } }

  /* ---------- stack: hatching ---------- */
  .legend { display: flex; flex-wrap: wrap; gap: 14px 30px; list-style: none; margin: 0 0 36px; padding: 16px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
  .legend li { display: flex; align-items: center; gap: 12px; font-size: 15px; }
  .legend b { font: 500 12.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
  .swatch { width: 40px; height: 40px; flex: none; display: block; }
  .swatch rect { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
  .materials { display: grid; gap: 40px 36px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
  .material h3 { font: 500 12.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
  .material h3 span { color: var(--pencil); }
  .material ul { list-style: none; margin: 0; padding: 0; }
  .material li { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--rule); }
  .material .t { font-weight: 500; line-height: 1.25; }
  .material .l { font: 400 12.5px var(--mono); color: var(--pencil); }

  /* ---------- career: time plot ---------- */
  .plot-box { position: relative; margin: 0 0 clamp(40px, 6vw, 72px); }
  .plot-box svg { display: block; width: 100%; overflow: visible; }
  .plot-box text { font: 500 11.5px var(--mono); fill: var(--graphite); }
  .plot-box text.co { font: 600 13px var(--display); fill: var(--ink); }
  .plot-box text.hand { font: 400 17px var(--hand); fill: var(--blue); }
  .plot-box text.todo { fill: var(--todo); font: 500 11.5px var(--mono); }
  .plot-box .axis { stroke: var(--ink); stroke-width: 1; }
  .plot-box .grid { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 2 4; }
  .entries { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: e; }
  .entry { display: grid; gap: 10px; padding: 28px 0; border-top: 1px solid var(--ink); }
  .entry .meta { font: 500 12.5px/1.5 var(--mono); color: var(--pencil); text-transform: uppercase; letter-spacing: .06em; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .entry .meta b { color: var(--ink); font-weight: 500; }
  .entry h3 { margin: 0; font: 700 clamp(24px, 3vw, 36px)/1.05 var(--display); letter-spacing: -.03em; }
  .entry .roles { margin: 0; font-weight: 500; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .entry .roles .arrow { color: var(--blue); }
  .entry .promo { font-size: 19px; transform: rotate(-2deg); }
  .entry ul.points { margin: 0; padding-left: 1.1em; max-width: 68ch; }
  .entry ul.points li { margin-bottom: .4em; }
  .entry ul.points li::marker { content: '– '; color: var(--blue); }
  .tags { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font: 400 13px var(--mono); color: var(--graphite); }
  .tags li::before { content: '#'; color: var(--blue); margin-right: 1px; }
  .edu { border-top: 1px solid var(--ink); padding-top: 18px; font-size: 15px; color: var(--graphite); }
  .edu b { color: var(--ink); }
  @media (min-width: 900px) { .entry { grid-template-columns: 220px 1fr; column-gap: 40px; } .entry > .meta { grid-row: span 6; flex-direction: column; } }

  /* ---------- team: peer review ---------- */
  .reviews { display: grid; gap: 36px; counter-reset: r; }
  .review { margin: 0; display: grid; grid-template-columns: 54px 1fr; gap: 6px 18px; }
  .review .r { font: 500 12.5px var(--mono); color: var(--pencil); padding-top: 8px; }
  .review svg { grid-row: span 2; display: none; }
  .review blockquote { margin: 0; font: 500 clamp(20px, 2.2vw, 28px)/1.35 var(--display); letter-spacing: -.015em; }
  .review blockquote p { margin: 0 0 .4em; }
  .review figcaption { grid-column: 2; font: 400 13px/1.5 var(--mono); color: var(--graphite); }
  .review figcaption b { font: 700 20px var(--hand); color: var(--blue); margin-right: 8px; letter-spacing: 0; }
  @media (min-width: 900px) { .reviews { grid-template-columns: 1fr 1fr; gap: 56px 64px; } .review:first-child { grid-column: 1 / -1; } .review:first-child blockquote { font-size: clamp(26px, 3vw, 38px); max-width: 26em; } }

  /* ---------- projects: plates ---------- */
  .plates { list-style: none; margin: 0; padding: 0; display: grid; gap: 28px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
  .plate { border: 1.5px solid var(--ink); background: var(--paper); display: grid; grid-template-rows: auto 1fr; }
  .plate .art { position: relative; aspect-ratio: 4 / 3; border-bottom: 1px solid var(--ink); background: radial-gradient(var(--rule) .7px, transparent .8px) 0 0 / 14px 14px; }
  .plate .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .plate .art .pl { position: absolute; left: 10px; top: 8px; font: 500 11px var(--mono); color: var(--pencil); letter-spacing: .08em; background: var(--paper); padding: 0 4px; }
  .stamp { position: absolute; right: 12px; bottom: 12px; font: 500 11.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 6px 8px; border: 1.5px solid currentColor; transform: rotate(-4deg); background: var(--paper); }
  .stamp.live { color: var(--blue); } .stamp.in-progress { color: var(--ink); border-style: dashed; } .stamp.archived { color: var(--pencil); }
  .plate .body { padding: 18px 20px 20px; display: grid; gap: 10px; align-content: start; }
  .plate h3 { margin: 0; font: 700 21px/1.15 var(--display); letter-spacing: -.02em; }
  .plate p { margin: 0; font-size: 15.5px; color: #2D3038; }
  .plate .sub { font: 400 13px/1.5 var(--mono); color: var(--graphite); }
  .plate .links { display: flex; gap: 16px; font: 500 13.5px var(--mono); }
  .count { margin-top: 24px; }

  /* ---------- contact ---------- */
  .letters { display: grid; gap: clamp(28px, 5vw, 64px); }
  .contact h2 { font-size: clamp(44px, 9vw, 120px); }
  .addr { list-style: none; margin: 0; padding: 0; font: 400 15.5px/1.5 var(--mono); }
  .addr li { display: flex; align-items: baseline; gap: 8px; padding: 10px 0; flex-wrap: wrap; }
  .addr .k { color: var(--pencil); text-transform: uppercase; font-size: 12.5px; letter-spacing: .06em; }
  .addr .dots { flex: 1; border-bottom: 1px dotted var(--graphite); min-width: 20px; transform: translateY(-4px); }

  .js .rise.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .js .rise { opacity: 1; transform: none; transition: none; }
    .js .note.write { clip-path: none; transition: none; }
    .btn, .nib { transition: none; }
  }
</style>

        </div>
        <div class="ctas" id="heroCtas"></div>
      </div>

    </div>
  </section>

  <section id="about" aria-labelledby="about-title">

      <div class="fig-head" id="about-head"></div>
      <div class="about">
        <div class="about-text rise" id="aboutText"></div>
        <aside class="margin" id="aboutMargin" aria-label="Margin notes"></aside>
      </div>
    </div>
  </section>

  <section id="stack" aria-labelledby="stack-title">
    <div class="wrap">
      <div class="fig-head" id="stack-head"></div>
      <ul class="legend" id="legend"></ul>
      <div class="materials" id="materials"></div>
    </div>
  </section>

  <section id="career" aria-labelledby="career-title">
    <div class="wrap">
      <div class="fig-head" id="career-head"></div>
      <figure class="plot-box" id="plotBox" style="margin-inline:0">
        <svg id="timePlot" role="img"></svg>
        <span class="nib" id="plotNib" aria-hidden="true"></span>
      </figure>
      <ol class="entries" id="entries"></ol>
      <p class="edu" id="edu"></p>
    </div>
  </section>

  <section id="team" aria-labelledby="team-title">
    <div class="wrap">
      <div class="fig-head" id="team-head"></div>
      <div class="reviews" id="reviews"></div>
    </div>
  </section>

  <section id="projects" aria-labelledby="projects-title">
    <div class="wrap">
      <div class="fig-head" id="projects-head"></div>
      <ul class="plates" id="plates"></ul>
      <p class="caption count" id="projectsCount"></p>
    </div>
  </section>

  <section id="contact" class="contact" aria-labelledby="contact-title">
    <div class="wrap">
      <div class="fig-head" id="contact-head"></div>
      <div class="letters">
        <div>
          <h2 id="contact-title"></h2>
          <p class="avail" id="availability"></p>
        </div>
        <div>
          <ul class="addr" id="addr"></ul>
          <div class="ctas" id="contactCtas" style="margin-top:22px"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="title-block" id="titleBlock"></div>
  </div>
</footer>

  /* =====================================================================
     Helpers
     ===================================================================== */
  const $ = (s, r = document) => r.querySelector(s);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v; else if (k === 'html') n.innerHTML = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };
  const sv = (tag, attrs = {}) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const downloadIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14" stroke-linecap="square"/></svg>';
  const figHead = (id, fig, title, dim, caption) => {
    const h = $(`#${id}-head`);
    h.append(
      el('p', { class: 'fig-no', text: fig }),
      el('h2', { id: `${id}-title`, text: title }),
      el('div', { class: 'dim', 'aria-hidden': 'true', html: `<i class="l"></i><span>${dim}</span><i class="r"></i>` }));
    if (caption) h.append(el('p', { class: 'caption', html: `<b>${caption[0]}</b>${caption[1]}` }));
  };

  /* =====================================================================
     Render from CONTENT
     ===================================================================== */
  function render() {
    const C = CONTENT, P = C.profile;
    // the drawing frame: zone numbers and letters
    const frame = $('#frame');
    const zones = (cls, items) => frame.append(el('div', { class: `zones ${cls}`, html: items.map(i => `<span>${i}</span>`).join('') }));
    zones('h zt', [1, 2, 3, 4, 5, 6, 7, 8]); zones('h zb', [1, 2, 3, 4, 5, 6, 7, 8]);
    zones('v left', ['A', 'B', 'C', 'D', 'E', 'F']); zones('v right', ['A', 'B', 'C', 'D', 'E', 'F']);
    for (const t of ['t', 'b', 'l', 'r']) frame.append(el('span', { class: `tick ${t}` }));

    $('#brand').innerHTML = `<b>${P.initials}</b><span>${C.brand}</span>`;
    $('#brand').setAttribute('aria-label', `${P.name}, back to top`);
    C.nav.forEach((n, i) => $('#navList').append(el('li', {}, el('a', { href: `#${n.id}`, html: `<span aria-hidden="true">${String(i + 1).padStart(2, '0')}</span>${n.label}` }))));

    // hero
    $('#sheetMeta').innerHTML = C.hero.meta.map(m => `<span>${m}</span>`).join('');
    $('#hero-name').append(el('span', { class: 'trace', 'data-trace': '', text: P.first }), el('span', { class: 'trace last', 'data-trace': '', text: P.last }));
    $('#role').textContent = P.role;
    $('#tagline').textContent = P.tagline;
    $('#heroCtas').append(
      el('a', { class: 'btn btn-primary', href: P.cvFile, download: '', html: `${downloadIcon}${C.hero.cv}` }),
      el('a', { class: 'btn btn-ghost', href: '#contact', text: C.hero.contact }));
    $('#heroNote').textContent = C.hero.note;

    // about
    const A = C.about;
    figHead('about', A.fig, A.title, A.dim);
    for (const p of A.text) $('#aboutText').append(el('p', { text: p }));
    for (const m of A.margin) $('#aboutMargin').append(el('div', { class: 'item' }, el('span', { class: 'note write', text: m.note }), el('small', { text: m.small })));

    // stack
    const S = C.stack;
    figHead('stack', S.fig, S.title, S.dim, S.caption);
    for (const lv of ['strong', 'medium', 'low']) $('#legend').append(el('li', {}, HatchSwatch(lv), el('span', { html: `<b>${S.levels[lv]}</b><br>${S.levelText[lv]}` })));
    for (const g of S.groups) {
      const ul = el('ul');
      for (const [name, lv] of g.items) ul.append(el('li', {}, HatchSwatch(lv), el('span', { class: 't', text: name }), el('span', { class: 'l', text: S.levels[lv] })));
      $('#materials').append(el('div', { class: 'material rise' }, el('h3', { html: `${g.name}<span>${g.items.length} items</span>` }), ul));
    }

    // career
    const K = C.career;
    figHead('career', K.fig, K.title, K.dim, K.caption);
    $('#timePlot').setAttribute('aria-label', K.plotLabel);
    K.jobs.forEach((j, n) => {
      const roles = el('p', { class: 'roles' });
      j.roles.forEach((r, i) => { if (i) roles.append(el('span', { class: 'arrow', 'aria-label': 'promoted to', text: '→' })); roles.append(el('span', { text: r })); });
      if (j.promoted) roles.append(el('span', { class: 'note blue promo', text: `(${K.promoted})` }));
      const pts = el('ul', { class: 'points' }); for (const p of j.points) pts.append(el('li', { text: p }));
      const tags = el('ul', { class: 'tags', 'aria-label': 'Stack' }); for (const t of j.stack) tags.append(el('li', { text: t }));
      $('#entries').append(el('li', { class: 'entry rise' },
        el('p', { class: 'meta', html: `<b>${j.dates}</b><span>Note ${n + 1}</span>` }),
        el('h3', { text: j.company }), roles, pts, tags));
    });
    $('#edu').innerHTML = `${K.education.label}: <b>${K.education.school}</b>, ${K.education.degree}, ${K.education.dates}`;

    // team
    const T = C.team;
    figHead('team', T.fig, T.title, T.dim, T.caption);
    T.quotes.forEach((q, i) => $('#reviews').append(el('figure', { class: 'review rise' },

      el('figcaption', { html: `<b>${q.name}</b>${q.role} · ${T.source}` }))));

    // projects: built from the array, so the list can grow
    const Pr = C.projects;
    figHead('projects', Pr.fig, Pr.title, Pr.dim, Pr.caption);
    Pr.items.forEach((p, i) => {
      const links = el('p', { class: 'links' });
      if (p.repo) links.append(el('a', { href: p.repo, text: Pr.repoLabel, 'aria-label': `${p.name}: repository on GitHub` }));
      if (p.demo) links.append(el('a', { href: p.demo, text: 'Demo' }));
      const tags = el('ul', { class: 'tags', 'aria-label': 'Tags' }); for (const t of p.tags) tags.append(el('li', { text: t }));
      const art = el('div', { class: 'art' }, Harmonograph(p.name), el('span', { class: 'pl', 'aria-hidden': 'true', text: Pr.plate(i + 1) }),
        el('span', { class: `stamp ${p.status.replace(' ', '-')}`, text: Pr.statusLabels[p.status] }));
      $('#plates').append(el('li', { class: 'plate rise' }, art, el('div', { class: 'body' },
        el('h3', { text: p.name }), p.note ? el('p', { class: 'sub', text: p.note }) : null, el('p', { text: p.description }), tags, links.childNodes.length ? links : null)));
    });
    $('#projectsCount').textContent = Pr.count(Pr.items.length);

    // contact
    const Ct = C.contact;
    figHead('contact', Ct.fig, '', Ct.dim);
    $('#contact-head h2').remove();
    $('#contact-title').textContent = Ct.title;
    $('#availability').textContent = P.availability;
    const row = (k, v) => $('#addr').append(el('li', {}, el('span', { class: 'k', text: k }), el('span', { class: 'dots', 'aria-hidden': 'true' }), v));
    row(Ct.fields.email, el('a', { href: `mailto:${P.email}`, text: P.email }));
    row(Ct.fields.linkedin, P.linkedin ? el('a', { href: P.linkedin, text: 'LinkedIn' }) : el('span', { class: 'todo', text: Ct.todoUrl }));
    row(Ct.fields.github, el('a', { href: P.github, text: P.github.replace('https://', '') }));
    row(Ct.fields.calendly, P.calendly ? el('a', { href: P.calendly, text: Ct.fields.calendly }) : el('span', { class: 'todo', text: Ct.todoUrl }));
    $('#contactCtas').append(
      el('a', { class: 'btn btn-primary', href: P.cvFile, download: '', html: `${downloadIcon}${Ct.cv}` }),
      el('a', { class: 'btn btn-ghost', href: `mailto:${P.email}`, text: Ct.mail }));

    // footer: the title block
    const F = C.footer, tb = $('#titleBlock');
    tb.append(el('div', { class: 'wide', html: `<small>Title</small>${F.title}` }));
    for (const [k, v] of F.cells) tb.append(el('div', { html: `<small>${k}</small>${v}` }));
    tb.append(el('div', { html: `<small>Date</small>${new Date().getFullYear()}` }));
    tb.append(el('div', { class: 'span2', html: `<small>Notes</small>${F.built} · <a href="${F.repo}">${F.repoLabel}</a>` }));
  }

  /* =====================================================================
     HatchSwatch — custom SVG: the hatch pattern names the level
     strong = cross-hatch, medium = single 45° hatch, low = stipple
     ===================================================================== */
  function HatchSwatch(level) {
    const s = 40, step = level === 'strong' ? 5 : 6;

  /* =====================================================================

  /* =====================================================================

  /* =====================================================================

  const PlotReveal = {

      paths.forEach((p, i) => { p.style.strokeDasharray = `${lens[i]} ${lens[i] + 1}`; p.style.strokeDashoffset = reduced ? 0 : lens[i]; });

  /* =====================================================================

        (a tight blur for the ridge, a wide one for the slopes) and mixed with a little seeded
        noise, so the name becomes a mountain range on gently rolling ground.
     2. Marching squares. For each contour level, every grid cell is classified by which of
        its four corners are above the level; the 16 cases give 0–2 line segments, with
        endpoints interpolated along the cell edges.
     3. Chaining. Segments sharing a cell edge are joined into polylines, so the plotter can
        draw each contour as one continuous line (and the nib travels like a real pen).
     4. Plotting. Polylines are drawn a little more each frame, innermost first, while the nib
        follows the pen. Afterwards the pointer raises the field (a fading trail of hills)
        and the contours are recomputed live, drawn straight from the segments.
     ===================================================================== */

      if (!this.ctx) { document.documentElement.classList.add('no-canvas'); this.fallback(); return false; }

    },
    fallback() {

    },
    build() {

      this.cv.width = Math.round(this.W * dpr); this.cv.height = Math.round(this.H * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const small = this.W < 700;
      const c = this.c = small ? 5 : 6;
      const gw = this.gw = Math.ceil(this.W / c) + 1, gh = this.gh = Math.ceil(this.H / c) + 1;
      // 1. mask of the name at grid resolution
      const m = document.createElement('canvas'); m.width = gw; m.height = gh;
      const g = m.getContext('2d', { willReadFrequently: true });
      g.setTransform(1 / c, 0, 0, 1 / c, 0, 0); g.fillStyle = '#000';
      for (const t of document.querySelectorAll('.name [data-trace]')) {
        const cs = getComputedStyle(t), r = t.getBoundingClientRect(), fs = parseFloat(cs.fontSize);
        g.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        if ('letterSpacing' in g) g.letterSpacing = cs.letterSpacing === 'normal' ? '0px' : cs.letterSpacing;
        const mt = g.measureText(t.textContent), asc = mt.fontBoundingBoxAscent || fs * .95, desc = mt.fontBoundingBoxDescent || fs * .25;

      let mx = 0; for (let i = 0; i < far.length; i++) mx = Math.max(mx, near[i] * .5 + far[i]);
      const r = rng(hash('ralph')), o = [r() * 9, r() * 9, r() * 9], B = this.base = new Float32Array(gw * gh);

          for (let x = 0; x < w; x++) { b[y * w + x] = s / win; s += a[y * w + Math.min(w - 1, x + rad + 1)] - a[y * w + Math.max(0, x - rad)]; } }
        for (let x = 0; x < w; x++) { let s = 0; for (let y = -rad; y <= rad; y++) s += b[Math.min(h - 1, Math.max(0, y)) * w + x];
          for (let y = 0; y < h; y++) { a[y * w + x] = s / win; s += b[Math.min(h - 1, y + rad + 1) * w + x] - b[Math.max(0, y - rad) * w + x]; } }

        const Bm = () => P(i + gw, x, y + 1, d, x + 1, y + 1, cc), L = () => P(HO + i, x, y, a, x, y + 1, d);
        const add = (e1, e2) => { segs.push(e1, e2); };

          case 4: case 11: add(T(), R()); break;
          case 6: case 9: add(T(), Bm()); break;

  /* FitName — custom: the name fills the column exactly */
  function FitName() {
    const h = $('.name');
    h.style.fontSize = '';
    const avail = h.parentElement.clientWidth, fs = parseFloat(getComputedStyle(h).fontSize);
    const widest = Math.max(...[...h.querySelectorAll('.trace')].map(t => t.scrollWidth));
    h.style.fontSize = `${Math.min(176, fs * avail / widest * .98)}px`;
  }

  /* Handwriting + Rise — custom (IntersectionObserver): notes are written in, blocks rise in */
  function Reveal() {
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      const sibs = [...e.target.parentElement.children];
      // a note hidden by clip-path never intersects, so its parent is observed instead
      const targets = e.target.matches('.rise') ? [e.target] : [...e.target.querySelectorAll(':scope > .note.write')];
      setTimeout(() => targets.forEach(t => t.classList.add('in')), reduced ? 0 : Math.min(400, sibs.indexOf(e.target) * 90));
    }), { threshold: .15 });
    document.querySelectorAll('.rise').forEach(n => io.observe(n));
    new Set([...document.querySelectorAll('.note.write')].map(n => n.parentElement)).forEach(p => io.observe(p));
  }

  /* Replot — custom easter egg: type "plot" anywhere */
  function Replot() {
    let buf = '';
    addEventListener('keydown', e => {
      if (e.target.closest('input, textarea') || e.key.length !== 1) return;
      buf = (buf + e.key.toLowerCase()).slice(-4);
      if (buf === 'plot') { buf = ''; if (fieldOk) ContourPlot.plot(); PlotReveal.replay(); }
    });
  }

  /* NavMenu — custom: mobile menu with a focus trap; marks the current section */
  function NavMenu() {
    const btn = $('#menuBtn'), nav = $('#nav'), close = $('#menuClose');
    const links = () => [...nav.querySelectorAll('a, button')];
    const open = v => {
      nav.classList.toggle('open', v); btn.setAttribute('aria-expanded', String(v));
      document.body.style.overflow = v ? 'hidden' : '';
      (v ? links()[0] : btn).focus();
    };
    btn.addEventListener('click', () => open(true));
    close.addEventListener('click', () => open(false));
    nav.addEventListener('click', e => { if (e.target.closest('a') && nav.classList.contains('open')) open(false); });
    nav.addEventListener('keydown', e => {
      if (!nav.classList.contains('open')) return;
      if (e.key === 'Escape') open(false);
      if (e.key === 'Tab') {
        const l = links(), first = l[0], last = l[l.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    const io = new IntersectionObserver(es => es.forEach(e => {
      const a = nav.querySelector(`a[href="#${e.target.id}"]`);
      if (a && e.isIntersecting) { nav.querySelectorAll('a').forEach(x => x.removeAttribute('aria-current')); a.setAttribute('aria-current', 'true'); }
    }), { rootMargin: '-45% 0px -50% 0px' });
    CONTENT.nav.forEach(n => io.observe(document.getElementById(n.id)));
  }

  function ConsoleHello() { console.log(`%c${CONTENT.console}`, 'color:#1B3D94;font:500 13px/1.5 monospace'); }

  /* =====================================================================
     Boot
     ===================================================================== */
  render();
  NavMenu(); Reveal(); Replot(); ConsoleHello();
  const fieldOk = ContourPlot.init();
  document.fonts.ready.then(() => {
    FitName();
    TimePlot();
    PlotReveal.observe();
    if (fieldOk) { ContourPlot.build(); ContourPlot.plot(); }
  });
  let rt, lastW = innerWidth;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      if (Math.abs(innerWidth - lastW) < 2) return; // ignore mobile toolbar height changes
      lastW = innerWidth;
      FitName(); TimePlot(); PlotReveal.observe($('#plotBox'));
      if (fieldOk) { ContourPlot.build(); ContourPlot.plot(); }
    }, 200);
  });
</script>
</body>
