<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The same on every page, so they live here; the title, description and sharing tags
         come from the content layer through the head marker below (src/app/app.utils.ts). -->
    <meta name="theme-color" content="#0b0b0e" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The display font of the hero name, fetched before the CSS asks for it (src/styles/fonts.scss).
         Both subsets: the name has Ł and Ć. -->
    <link
      rel="preload"
      href="/fonts/big-shoulders-display-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/big-shoulders-display-latin-ext.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/app/entryClient.tsx"></script>
  </body>
</html>
