# Lighthouse CI (`pnpm lighthouse`, and the Lighthouse job in .github/workflows/ci.yml).
# Audits the pre-rendered pages in dist/, so run `pnpm build` first.
# Decision and alternatives: docs/DECISIONS.md #006.
ci:
  collect:
    # lhci serves dist/ on a local server and audits every HTML file it finds there.
    staticDistDir: ./dist
    # The 404 page asks search engines not to index it, which Lighthouse scores as an SEO
    # failure. That is intended, so the page is left out; it is checked in the audits instead.
    autodiscoverUrlBlocklist:
      - /404.html
    # One run can be a few points off on a shared CI machine; the assertions below use the median of three.
    numberOfRuns: 3
    # No `preset`: the Lighthouse default is mobile (an emulated phone with a slow network and a 4× slower CPU),
    # which is what brief section 1 measures.

  assert:
    # The thresholds from brief section 1. Any category below its score fails the run.
    # `aggregationMethod: median`, because the default ("optimistic") would judge only the best run.
    assertions:
      categories:performance:
        - error
        - minScore: 0.9
          aggregationMethod: median
      categories:accessibility:
        - error
        - minScore: 0.95
          aggregationMethod: median
      categories:best-practices:
        - error
        - minScore: 0.95
          aggregationMethod: median
      categories:seo:
        - error
        - minScore: 0.95
          aggregationMethod: median

  upload:
    # HTML and JSON reports on disk. CI uploads them as a workflow artifact; no external service.
    target: filesystem
    outputDir: ./.lighthouseci/reports
